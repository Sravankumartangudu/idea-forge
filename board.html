    ${S.chShaping.has(c.id) ? `<div class="shimmer">✨ Shaping with ${esc(word())}</div>` : ''}
    ${S.sparking.has(c.id) ? `<div class="shimmer">✨ Sparking ideas</div>` : ''}
    ${c.shapeError ? `<div class="err">⚠︎ <span>${esc(c.shapeError.slice(0, 140))}</span> <button data-chretry="${esc(c.id)}">Retry</button></div>` : ''}
    ${c.sparkError ? `<div class="err">⚠︎ <span>${esc(c.sparkError.slice(0, 140))}</span> <button data-spark="${esc(c.id)}">Retry</button></div>` : ''}
  </article>`;
}

function nextRank(i) {
  if (!isPending(i) || !S.doc.next) return 0;
  return (S.doc.next.picks || []).findIndex(p => p.n === i.n) + 1;
}

function colHTML(key, color, title, count, sub, inner, empty, extra = '') {
  return `<section class="col ${extra}" style="--c:${color}">
    <div class="col-h"><span class="dot"></span><h2>${title}</h2><span class="count">${count}</span></div>
    <div class="col-sub">${sub}</div>
    <div class="list" data-drop="${esc(key)}">${inner || `<div class="empty">${empty}</div>`}</div>
  </section>`;
}
const hiddenNote = (all, shown) => all - shown ? ` · ${all - shown} hidden by filters` : '';

function renderStages() {
  return STAGES.map(s => {
    const list = ideas().filter(i => i.status === s.k).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)), shown = list.filter(matches);
    return colHTML('s:' + s.k, `var(--${s.k})`, `${s.icon} ${s.name}`, list.length, s.hint + hiddenNote(list.length, shown.length),
      shown.map(i => cardHTML(i)).join(''), list.length ? 'No matches' : (s.k === 'inbox' ? 'Your forge is cold 🔥<br>Drop a thought above' : 'Drag a card here'));
  }).join('');
}
// One column per group (an agent, or the app ideas are for); drop a card on a column to move it there.
let groupKeys = [];
function renderGroups() {
  const live = ideas().filter(i => !['removed', 'suggested'].includes(i.status));
  const rank = i => STAGES.findIndex(s => s.k === i.status);
  const by = new Map();
  for (const i of live) { const g = groupOf(i); by.set(g, [...(by.get(g) || []), i]); }
  const pend = g => (by.get(g) || []).filter(isPending).length;
  groupKeys = [...by.keys()].filter(Boolean).sort((a, b) => pend(b) - pend(a) || a.localeCompare(b));
  for (const g of S.newGroups || []) if (!groupKeys.includes(g)) groupKeys.push(g);
  if (S.fGroup && !groupKeys.includes(S.fGroup)) groupKeys.unshift(S.fGroup);
  groupKeys.push('');
  const html = groupKeys.filter(g => !S.fGroup || g === S.fGroup).map(g => {
    const list = (by.get(g) || []).sort((a, b) => rank(a) - rank(b) || (a.order ?? 0) - (b.order ?? 0)), shown = list.filter(matches);
    const home = HOMES[appHome(g)];
    return colHTML('g:' + groupKeys.indexOf(g), g ? avColor(g) : 'var(--faint)', g ? `▤ ${esc(g)}` : '◌ Ungrouped', list.length,
      (g ? `${pend(g)} pending${home ? ' · ' + home.icon + ' ' + home.name : ''}` : 'Drag a card onto a group to file it') + hiddenNote(list.length, shown.length),
      shown.map(i => cardHTML(i, true)).join(''), list.length ? 'No matches' : (g ? 'Drag a card here' : 'Everything has a group 🎉'));
  }).join('');
  return html + `<section class="col add-grp"><button class="btn" data-newgroup>＋ New group</button>
    <div class="col-sub" style="margin-top:8px">A group gathers the ideas for one agent or app — an agent you plan to build can collect many ideas before it exists.</div></section>`;
}
function renderChallenges() {
  return CSTAGES.map(s => {
    const list = chs().filter(c => ['open', 'solved'].includes(c.status) && chStage(c) === s.k)
      .sort(s.k === 'solved' ? (a, b) => (b.solvedAt || '').localeCompare(a.solvedAt || '') : (a, b) => heat(b) - heat(a));
    const shown = list.filter(chMatches);
    return colHTML('c:' + s.k, `var(--${s.c})`, `${s.icon} ${s.name}`, list.length, s.hint + hiddenNote(list.length, shown.length),
      shown.map(chCardHTML).join(''), list.length ? 'No matches' : (s.k === 'open' ? (chs().some(c => ['open', 'solved'].includes(c.status)) ? 'Nothing waiting 🎉<br>Every challenge has an idea' : 'No challenges yet 🧗<br>Write down something that slows you down') : s.k === 'ideas' ? 'Spark or link an idea to a challenge' : 'Ship a linked idea to solve one'));
  }).join('');
}
function renderMatrix() {
  const live = ideas().filter(i => isPending(i));
  const un = live.filter(i => !i.impact).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)), unShown = un.filter(matches);
  const btn = `<button class="btn ${S.placing ? 'busy' : ''}" data-place="${un.length ? 'new' : 'all'}" ${S.placing ? 'disabled' : ''} style="margin:0 0 8px">${S.placing ? '✨ Placing…' : un.length ? `✨ Let ${esc(word())} place them` : '✨ Re-place all'}</button>`;
  return colHTML('q:none', 'var(--faint)', '◌ Unplaced', un.length, 'Pending ideas without impact × effort yet' + hiddenNote(un.length, unShown.length),
      btn + unShown.map(i => cardHTML(i)).join(''), '', 'unplaced')
    + QUADS.map(q => {
      const [imp, eff] = q.k.split(':'), list = live.filter(i => i.impact === imp && i.effort === eff), shown = list.filter(matches);
      return colHTML('q:' + q.k, q.c, `${q.icon} ${q.name}`, list.length, q.hint + hiddenNote(list.length, shown.length), shown.map(i => cardHTML(i)).join(''), 'Drag a card here');
    }).join('');
}

function render() {
  const board = $('#board');
  const scroll = Object.fromEntries($$('.list', board).map(l => [l.dataset.drop, l.scrollTop]));
  const left = board.scrollLeft;
  board.classList.toggle('selecting', S.selecting);
  board.classList.toggle('mx', S.tab === 'matrix');
  board.innerHTML = S.tab === 'challenges' ? renderChallenges() : S.tab === 'matrix' ? renderMatrix() : S.view === 'groups' ? renderGroups() : renderStages();
  $$('.list', board).forEach(l => { l.scrollTop = scroll[l.dataset.drop] || 0; });
  board.scrollLeft = left;
  setTimeout(() => flashIds.clear(), 50);
  renderStats();
  renderTabs();
  renderSelbar();
  if (S.open && !$('#drawer').contains(document.activeElement)) renderDrawer();
  if ($('#trayPop').classList.contains('on')) renderTray();
}

function renderStats() {

function renderFilters() {
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label)}</option>`;
  $('#fType').innerHTML = opt('all', 'All types', S.fType) + Object.entries(TYPES).map(([k, t]) => opt(k, `${t.icon} ${t.name}`, S.fType)).join('') + opt('none', 'Unshaped', S.fType);
  $('#fHome').innerHTML = opt('all', 'Anywhere', S.fHome) + Object.entries(HOMES).map(([k, h]) => opt(k, `${h.icon} ${h.name}`, S.fHome)).join('') + opt('none', '🤔 Undecided', S.fHome);
  const used = groups();
  if (S.fGroup && !used.includes(S.fGroup)) used.push(S.fGroup);

  $('#fOrigin').innerHTML = opt('all', 'Added by anyone', S.fOrigin) + Object.entries(ORIGINS).map(([k, o]) => opt(k, `${o.icon} ${o.name}`, S.fOrigin)).join('');

  sw.disabled = !aiOK();

}

function renderAll() {

function segHTML(name, opts, cur, extra = '') {

function originHTML(x) {

    ${by === 'teammate' ? `<input type="text" data-of="name" value="${esc(o.name || '')}" placeholder="Who suggested it?" list="peopleList2" style="margin-top:6px">

    ${o.label || o.source || url ? `<div class="src">${[o.label, o.source].filter(Boolean).map(esc).join(' · ')}${url ? ` · <a href="${esc(url)}">Open source ↗</a>` : ''}</div>` : ''}</div>`;
}

function renderDrawer() {
  if (S.openKind === 'challenge') return renderChDrawer();
  const i = byId(S.open);
  const d = $('#drawer');
  if (!i) { closeDrawer(); return; }
  const steps = i.steps || [];
  const done = steps.filter(s => s.done).length;
  const h = HOMES[i.home];
  const app = S.apps.find(a => a.name.toLowerCase() === (i.app || '').toLowerCase());
  const opts = chs().filter(c => ['open', 'solved'].includes(c.status) || c.id === i.challenge);
  const gl = [...new Set([...groups(), ...S.apps.map(a => a.name)])];
  d.innerHTML = `
    <div class="d-head">
      <span class="ref">#${i.n ?? '–'}</span><span>Added ${fmtDate(i.created)}${i.updated && i.updated !== i.created ? ' · edited ' + fmtDate(i.updated) : ''}</span>
      <button class="btn icon" data-act="close" aria-label="Close" title="Close (Esc)">✕</button>
    </div>
    <div class="d-body">
      ${i.status === 'suggested' ? `<div class="note" style="margin:0 0 12px">✨ Suggested by ${esc(word())} — keep it to add it to your board.
        <div class="sug-act"><button class="btn primary" data-act="keep">Keep</button><button class="btn" data-act="dismiss">Dismiss</button></div></div>` : ''}
      <textarea class="d-title" rows="1" data-f="title" placeholder="Give it a name">${esc(i.title)}</textarea>
      ${i.status !== 'suggested' ? `<div class="field"><span class="lbl">Stage</span>
        ${segHTML('status', STAGES.map(s => [s.k, `${s.icon} ${s.name}`, `--c:var(--${s.k})`]), i.status, 'stage')}</div>` : ''}
      <div class="row2">
        <div class="field"><span class="lbl">Type</span>${segHTML('type', Object.entries(TYPES).map(([k, t]) => [k, `${t.icon} ${t.name.replace('New agent', 'Agent').replace('Enhancement', 'Enhance')}`]), i.type)}</div>
        <div class="field"><span class="lbl">Priority</span>${segHTML('priority', Object.entries(PRIO).map(([k, p]) => [k, `${p.icon} ${p.name}`]), i.priority)}</div>
      </div>
      <div class="field"><span class="lbl">Where it ships</span>
        ${segHTML('home', Object.entries(HOMES).map(([k, x]) => [k, `${x.icon} ${x.name}`]), i.home)}
        <div class="home-hint">${h ? h.hint : '🤔 Not decided yet. Pick Personal if anyone could use it, Work if it touches work data or colleagues.'}</div></div>
      <div class="row2">
        <div class="field"><label for="dApp">For app <span style="text-transform:none;letter-spacing:0;font-weight:400">(empty = new agent)</span></label>
          <input type="text" id="dApp" data-f="app" list="appList" value="${esc(i.app)}" placeholder="One of your apps">
          <datalist id="appList">${S.apps.map(a => `<option value="${esc(a.name)}">${a.home ? HOMES[a.home]?.name || '' : ''}</option>`).join('')}</datalist></div>
        <div class="field"><label for="dGroup">▤ Group <span style="text-transform:none;letter-spacing:0;font-weight:400">(agent or app)</span></label>
          <input type="text" id="dGroup" data-f="group" list="groupList" value="${esc(i.group || '')}" placeholder="${esc(i.app || 'e.g. Standup Bot')}">
          <datalist id="groupList">${gl.map(g => `<option value="${esc(g)}">`).join('')}</datalist></div>
      </div>
      <div class="field"><label>What it does</label><textarea rows="3" data-f="summary" placeholder="One or two sentences anyone can understand">${esc(i.summary)}</textarea></div>
      <div class="field"><label>Why it matters</label><textarea rows="2" data-f="why" placeholder="The value — who it helps and how">${esc(i.why)}</textarea></div>
      <div class="field"><label for="dChal">🧗 Solves challenge</label>
        <select class="pill" id="dChal" data-chal>${`<option value="">— none —</option>` + opts.map(c => `<option value="${esc(c.id)}" ${c.id === i.challenge ? 'selected' : ''}>${c.n ? 'C#' + c.n : 'Suggested'} ${esc(clip(cname(c), 60))}</option>`).join('')}</select>
        ${i.challenge && chById(i.challenge) ? `<div class="src"><a href="#" data-gochal="${esc(i.challenge)}">Open the challenge →</a> · shipping this marks it solved</div>` : ''}</div>
      <div class="row2">
        <div class="field"><span class="lbl">Impact</span>${segHTML('impact', [['high', '⬆︎ High'], ['low', '⬇︎ Low']], i.impact || '')}</div>
        <div class="field"><span class="lbl">Effort</span>${segHTML('effort', [['low', '🪶 Low'], ['high', '🏋️ High']], i.effort || '')}</div>
      </div>
      ${i.placeWhy ? `<div class="src" style="margin-top:-4px">${esc(i.placeWhy)}</div>` : ''}
      <div class="field"><span class="lbl">Build steps ${steps.length ? `· ${done}/${steps.length} done` : ''}</span>

      ${(i.similar || []).length ? `<div class="field"><span class="lbl">🔁 Looks like</span>${i.similar.map(n => { const x = ideas().find(y => y.n === n);

      ${autoHTML(i)}
      ${askHTML(i)}
      <div class="field"><span class="lbl">🤝 Who can help</span>${tokensHTML('helpers', i.helpers, 'Add a name and press Return')}</div>
      <div class="field"><span class="lbl">Tags</span>${tokensHTML('tags', i.tags, 'Add a tag')}</div>
      ${originHTML(i)}
      <div class="field"><details class="raw" ${i.raw && !i.summary ? 'open' : ''}><summary>Original thought</summary>
        <textarea rows="4" data-f="raw" placeholder="Your words, as you first wrote them">${esc(i.raw)}</textarea></details></div>
      ${i.shapeError ? `<div class="err">⚠︎ ${esc(i.shapeError)}</div>` : ''}
    </div>
    <div class="d-foot">
      ${deployBtnHTML(i)}
      <button class="btn ${deployBtnHTML(i) ? '' : 'primary'}" data-act="reshape" ${aiOK() ? '' : `disabled title="${esc(S.ai.problem || 'Set up an AI in Settings')}"`}>${S.shaping.has(i.id) ? '✨ Shaping…' : (i.shapedAt ? '✨ Re-shape' : '✨ Shape')}</button>
      ${S.ai.claude ? `<button class="btn" data-act="build" data-tool="claude" title="Opens Claude Code in Terminal${i.app ? ' in ' + esc(i.app) + "'s folder" : ''}, with this card as the brief">🚀 Claude Code</button>` : ''}
      ${autoBtnHTML(i)}
      ${S.ai.codex ? `<button class="btn" data-act="build" data-tool="codex" title="Opens Codex in Terminal${i.app ? ' in ' + esc(i.app) + "'s folder" : ''}, with this card as the brief">🚀 Codex</button>` : ''}
      <button class="btn" data-act="brief" title="Copy a Markdown brief to share with someone who can help">📋 Copy brief</button>
      ${app && safeUrl(app.repo) ? `<button class="btn" data-act="issue" title="Open a new issue on ${esc(app.name)}'s repo, filled with this card">🐙 Open as issue</button>` : ''}
      <span class="grow"></span>
      <button class="btn danger" data-act="remove">🗑 Remove</button>
    </div>`;
  const ta = $('.d-title', d); autosize(ta);
}

  d.innerHTML = `
    <div class="d-head">
      <span class="ref">C#${c.n ?? '–'}</span><span>🧗 Challenge · added ${fmtDate(c.created)}${c.lastHit ? ' · last hit ' + fmtDate(c.lastHit) : ''}</span>
      <button class="btn icon" data-act="close" aria-label="Close" title="Close (Esc)">✕</button>
    </div>
    <div class="d-body">

      <div class="row2">
        <div class="field"><span class="lbl">Impact</span>${segHTML('cimpact', [['high', '🔥 High'], ['med', '⚡ Med'], ['low', '🌱 Low']], c.impact)}</div>

      <div class="field"><span class="lbl">💡 Ideas for it (${linked.length})</span>
        ${linked.map(i => `<div class="linked" data-open="${esc(i.id)}"><span class="ref">#${i.n}</span><span class="t">${esc(nameOf(i))}</span>
          <span class="chip stg" style="--c:var(--${i.status})">${stageOf(i.status)?.icon || ''} ${stageOf(i.status)?.name || ''}</span></div>`).join('') || '<div class="hint">No ideas yet.</div>'}
        ${sug.map(i => `<div class="linked" data-peek="${esc(i.id)}"><span class="chip o-ai">✨</span><span class="t">${esc(nameOf(i))}</span>
          <button class="btn primary" data-keep="${esc(i.id)}">Keep</button><button class="btn" data-dismiss="${esc(i.id)}">✕</button></div>`).join('')}
        <div class="sug-act">
          <button class="btn" data-act="spark" ${aiOK() && !S.sparking.has(c.id) ? '' : 'disabled'}>${S.sparking.has(c.id) ? '✨ Sparking…' : '✨ Spark ideas'}</button>
          <button class="btn" data-act="ownidea">＋ Write my own</button></div>
        ${c.sparkError ? `<div class="err">⚠︎ ${esc(c.sparkError)}</div>` : ''}</div>
      <div class="field"><details class="raw" ${c.raw && !c.detail ? 'open' : ''}><summary>Original note</summary>
        <textarea rows="4" data-cf="raw" placeholder="Your words, as you first wrote them">${esc(c.raw)}</textarea></details></div>
      ${c.shapeError ? `<div class="err">⚠︎ ${esc(c.shapeError)}</div>` : ''}
    </div>
    <div class="d-foot">
      <button class="btn primary" data-act="chreshape" ${aiOK() ? '' : 'disabled'}>${S.chShaping.has(c.id) ? '✨ Shaping…' : (c.shapedAt ? '✨ Re-shape' : '✨ Shape')}</button>
      <button class="btn" data-act="chcopy" title="Copy the challenge as Markdown">📋 Copy</button>
      <span class="grow"></span>
      <button class="btn danger" data-act="chremove">🗑 Remove</button>

function tokensHTML(field, list, ph) {
  return `<div class="tokens" data-tokens="${field}">${(list || []).map((t, k) =>
    `<span class="tok">${field === 'helpers' ? `<span class="av" style="background:${avColor(t)};width:16px;height:16px;font-size:8px;border:0">${esc(initials(t))}</span>` : ''}${esc(t)}<button data-tokdel="${k}" aria-label="Remove">✕</button></span>`).join('')}
    <input type="text" data-tokin="${field}" placeholder="${ph}"${field === 'helpers' && S.people.length ? ' list="peopleList"' : ''}>
    ${field === 'helpers' && S.people.length ? `<datalist id="peopleList">${S.people.map(p => `<option value="${esc(p)}">`).join('')}</datalist>` : ''}</div>`;
}

function setStatus(i, status) {
  if (i.status === status) return;
  if (status === 'removed') i.prevStatus = i.status;
  if (status === 'shipped') i.shippedAt = now();
  if (status === 'removed') i.removedAt = now();
  i.status = status;
  const col = ideas().filter(x => x.status === status && x !== i);
  i.order = status === 'shipped' || status === 'inbox' ? (col.length ? Math.min(...col.map(x => x.order ?? 0)) - 1 : 0)
                                                       : (col.length ? Math.max(...col.map(x => x.order ?? 0)) + 1 : 0);
  touch(i);
  // Shipping the idea for a challenge solves it.
  const c = status === 'shipped' && i.challenge && chById(i.challenge);
  if (c && c.status === 'open') { c.status = 'solved'; c.solvedAt = now(); touch(c); setTimeout(() => toast(`✅ C#${c.n} solved by #${i.n}`), 2600); }
}

// ---------- ⚡ Auto-build ----------
// Claude Code builds the card on its own in the background (in the app's folder, or a new folder in ~ for
// a new agent); nothing is committed. The card waits in Building, marked Built · not deployed, while the
// tracker follows the change through Committed, Pushed, Released and Installed (🚀 Deploy has Claude do
// those, or you ship it yourself); it moves to Shipped once the installed app holds it.
const deploying = i => !!(i.auto && i.auto.deploy && i.auto.deploy.state === 'running');
const autoRunning = i => !!(i.auto && (i.auto.state === 'running' || deploying(i)));
/// The steps this project's change goes through, from what the tracker found (all five until it reports).
function stages(i) {
  const t = (i.auto && i.auto.track) || {git:true, remote:true, tags:true, app:true};
  const s = [{k:'built', name:'Built', on:true}];
  if (!t.git) return s;
  s.push({k:'committed', name:'Committed', on:!!t.committed});
  if (t.remote) s.push({k:'pushed', name:'Pushed', on:!!t.pushed});
  if (t.tags || t.tag) s.push({k:'released', name:t.tag ? 'Released ' + t.tag : 'Released', on:!!t.tag});
  if (t.app) s.push({k:'installed', name:t.installed && t.version ? 'Installed ' + t.version : 'Installed', on:!!t.installed});
  return s;
}
const deployed = i => !!(i.auto && i.auto.state === 'done' && i.auto.track && i.auto.track.git && stages(i).every(x => x.on));
function pipeHTML(i) {
  const s = stages(i), t = i.auto.track;
  const tip = !t ? 'Checking…' : !t.git ? 'No git repo in this folder yet' : deployed(i) ? 'Deployed' : 'Not deployed yet: ' + s.filter(x => !x.on).map(x => x.name.split(' ')[0].toLowerCase()).join(', ') + ' to go';
  return `<div class="pipe" title="${esc(tip)}">${s.map(x => `<span class="${x.on ? 'on' : ''}">${x.on ? '✓' : '○'} ${esc(x.name)}</span>`).join('<i>›</i>')}${deployed(i) ? '' : '<span>· not deployed</span>'}</div>`;
}
/// Asks the app where each built change has got to (forge.tracked). At most every 10 s unless forced.
function trackAll(force) {
  if (S.demo || (!force && Date.now() - (S.trackedAt || 0) < 10000)) return;
  const items = ideas().filter(i => i.auto && i.auto.state === 'done' && i.auto.dir && i.auto.ended && !i.auto.landed && i.status !== 'removed' && !autoRunning(i))
    .map(i => ({id:i.id, dir:i.auto.dir, since:i.auto.ended, files:i.auto.files || []}));
  if (!items.length) return;
  S.trackedAt = Date.now();
  post({cmd:'track', items});
}
setInterval(() => { if (!document.hidden) trackAll(); }, 60000);
function deployIt(i) {
  const a = i.auto;
  a.deploy = {state:'running', started:now()};
  S.autoLive[i.id] = 'Starting';
  post({cmd:'deploy', id:i.id, n:i.n, dir:a.dir, summary:a.summary || '', files:a.files || []});
  toast(`🚀 Deploying #${i.n} from ~/${a.folder} — it moves to Shipped once it's installed`);
  flashIds.add(i.id);
  save(); closeDrawer(); render();
}
function autoWhere(i) {
  const app = S.apps.find(a => a.name.toLowerCase() === (i.app || '').toLowerCase() && a.path);
  if (app) return '~/' + app.path.split('/').filter(Boolean).pop();
  return i.auto && i.auto.folder ? '~/' + i.auto.folder : 'a new folder in ~';
}
/// 🚀 Deploy, in the card's bottom bar while a build waits to be shipped.
function deployBtnHTML(i) {
  const a = i.auto;
  if (!a || a.state !== 'done' || !a.dir || deployed(i) || autoRunning(i) || !S.ai.claude || S.demo || i.status === 'removed') return '';
  const sure = S.autoConfirm === 'deploy:' + i.id;
  return `<button class="btn primary" data-act="deploy" title="Claude Code commits, pushes, releases and installs it in ~/${esc(a.folder)}, the way this project ships (its README, changelog and scripts). It can't force-push, rewrite history or delete; it stops at $5 or 45 minutes.">${sure ? '🚀 Commit, push, release & install?' : '🚀 Deploy'}</button>`;
}
function autoBtnHTML(i) {
  if (deploying(i)) return `<button class="btn" data-act="autostop" title="Stops the deploy where it is; whatever it already committed or pushed stays.">⏹ Stop deploy</button>`;
  if (autoRunning(i)) return `<button class="btn" data-act="autostop" title="Stops the build. What it changed so far stays in the folder.">⏹ Stop build</button>`;
  if (!S.ai.claude || S.demo || ['shipped', 'removed'].includes(i.status)) return '';
  const sure = S.autoConfirm === i.id, where = autoWhere(i);
  return `<button class="btn ${sure ? 'primary' : ''}" data-act="auto" title="Claude Code builds it on its own in ${esc(where)}, in the background. The card moves to Building and stays there, marked Built · not deployed, until you 🚀 Deploy it. The build itself commits, pushes, releases and installs nothing; it stops at $5 or 45 minutes.">${sure ? `⚡ Build in ${esc(where)}?` : i.auto && i.auto.state === 'done' ? '⚡ Rebuild' : '⚡ Auto-build'}</button>`;
}
function autoBuild(i) {
  if (i.status === 'suggested') keepIdea(i);
  const from = i.status, last = i.auto || {};
  i.auto = {state:'running', started:now(), from, dir:last.dir || '', folder:last.folder || ''};
  S.autoLive[i.id] = 'Starting';
  setStatus(i, 'building');
  // Steps go numbered, done ones marked, so Claude can say which ones it finished.
  const steps = (i.steps || []).map(s => (s.done ? '(already done) ' : '') + s.t);
  post({cmd:'autoBuild', id:i.id, n:i.n, brief:brief(i), app:i.app || '', name:nameOf(i), steps, dir:last.dir || ''});
  // Close the card so it's seen landing in Building.
  flashIds.add(i.id);
  save(); closeDrawer(); render();
}
function autoHTML(i) {
  const a = i.auto;
  if (!a) return '';
  const where = a.folder ? '~/' + a.folder : '';
  if (deploying(i)) return `<div class="field"><span class="lbl">⚡ Auto-build · 🚀 Deploying</span>
    ${pipeHTML(i)}
    <div class="shimmer" style="margin-top:2px">🚀 <span class="live" data-autolive="${esc(i.id)}">${esc(S.autoLive[i.id] || 'Working')}</span></div>
    <div class="src">Started ${ago(a.deploy.started)}${where ? ' in ' + esc(where) : ''}. Claude commits, pushes, releases and installs it the way this project ships; it stops at $5 or 45 minutes.</div></div>`;
  if (a.state === 'running') return `<div class="field"><span class="lbl">⚡ Auto-build</span>
    <div class="shimmer" style="margin-top:2px">⚡ <span class="live" data-autolive="${esc(i.id)}">${esc(S.autoLive[i.id] || 'Working')}</span></div>
    <div class="src">Started ${ago(a.started)}${where ? ' in ' + esc(where) : ''}. It stops at $5 or 45 minutes and doesn't commit, push or release.</div></div>`;
  const head = a.state === 'done' ? (deployed(i) ? '🚀 Deployed' : '✅ Built · not deployed') : {failed:'⚠︎ Didn\'t finish', stopped:'⏹ Stopped'}[a.state] || '';
  const d = a.deploy, t = a.track;
  const files = a.files || [];
  const facts = [where, a.minutes != null && `${a.minutes} min`, typeof a.cost === 'number' && `$${a.cost.toFixed(2)}`].filter(Boolean).join(' · ');
  return `<div class="field"><span class="lbl">⚡ Auto-build · ${head}${a.ended ? ' ' + fmtDate(a.ended) : ''}</span>
    ${a.summary ? `<p class="auto-sum">${esc(a.summary)}</p>` : ''}
    ${a.error ? `<div class="err" style="margin-top:4px">⚠︎ <span>${esc(a.error)}</span></div>` : ''}
    ${a.tryIt ? `<div class="src">▶︎ <b>Try it:</b> ${esc(a.tryIt)}</div>` : ''}
    ${files.length ? `<details class="raw"><summary>${files.length} file${files.length > 1 ? 's' : ''} changed</summary><div class="src">${files.map(esc).join('<br>')}</div></details>` : ''}
    ${a.state === 'done' ? pipeHTML(i) : ''}
    ${d && d.state !== 'running' ? (d.state !== 'done' && deployed(i)
      // The deploy stopped short, but the change got installed anyway (finished by hand): the old error is history.
      ? `<div class="src">🚀 Deploy · ✅ Finished outside the deploy${t && t.version ? ' · installed ' + esc(t.version) : ''}${typeof d.cost === 'number' ? ` · $${d.cost.toFixed(2)}` : ''}</div>
      ${d.summary || d.error ? `<details class="raw"><summary>Where the deploy stopped${d.ended ? ' ' + fmtDate(d.ended) : ''}</summary>${d.summary ? `<p class="auto-sum">${esc(d.summary)}</p>` : ''}${d.error ? `<div class="src">${esc(d.error)}</div>` : ''}</details>` : ''}`
      : `<div class="src">🚀 Deploy · ${{done:'✅ Done', failed:'⚠︎ Didn\'t finish', stopped:'⏹ Stopped'}[d.state] || ''}${d.ended ? ' ' + fmtDate(d.ended) : ''}${d.version ? ' · ' + esc(d.version) : ''}${typeof d.cost === 'number' ? ` · $${d.cost.toFixed(2)}` : ''}</div>
      ${d.summary ? `<p class="auto-sum">${esc(d.summary)}</p>` : ''}${d.error ? `<div class="err" style="margin-top:4px">⚠︎ <span>${esc(d.error)}</span></div>` : ''}`) : ''}
    ${a.state === 'done' && !deployed(i) ? `<div class="note">${t && !t.git ? 'Not deployed: this folder has no git repo yet.' : 'Not deployed yet.'} Review the changes, then 🚀 Deploy (at the bottom) has Claude commit, push, release and install it the way this project ships. Shipping it yourself works too: the line above follows along and the card moves to Shipped once the installed app has it.</div>` : ''}
    ${facts ? `<div class="src">${esc(facts)}</div>` : ''}
    ${a.session && a.dir ? `<div class="sug-act"><button class="btn" data-act="autoresume" title="Opens the last Claude Code session for this card in Terminal, to ask what it did or finish the job">💬 Continue in Terminal</button></div>` : ''}</div>`;
}

function brief(i) {
  const t = TYPES[i.type], h = HOMES[i.home], p = PRIO[i.priority], c = i.challenge && chById(i.challenge);
  const lines = [`### ${t ? t.icon + ' ' : ''}${nameOf(i)}`, ''];
  if (i.summary) lines.push(i.summary, '');
  if (i.why) lines.push(`**Why:** ${i.why}`, '');
  if (c) lines.push(`**Solves:** ${cname(c)}${c.detail ? ' — ' + c.detail : ''} _(${OFTEN[c.often] || ''}, hit ${c.hits || 1}×)_`, '');
  const g = groupOf(i);
  const meta = [t && t.name, i.app && `for ${i.app}`, g && g !== i.app && `group ${g}`, h && `${h.icon} ${h.name}`, p && `${p.icon} ${p.name} priority`, stageOf(i.status)?.name].filter(Boolean);
  lines.push(`_${meta.join(' · ')}_`, '');
  if ((i.steps || []).length) { lines.push('**Steps**'); i.steps.forEach(s => lines.push(`- [${s.done ? 'x' : ' '}] ${s.t}`)); lines.push(''); }
  if ((i.helpers || []).length) lines.push(`**Who can help:** ${i.helpers.join(', ')}`);
  return lines.join('\n').trim();
}
function chText(c) {
  return [`### 🧗 C#${c.n ?? '–'} ${cname(c)}`, '', c.detail, c.where && `**Where:** ${c.where}`,
    `_${OFTEN[c.often] || ''} · ${c.impact} impact · hit ${c.hits || 1}× · ${c.status}_`,
    ...linkedIdeas(c).map(i => `- [${i.status === 'shipped' ? 'x' : ' '}] #${i.n} ${nameOf(i)}`)].filter(x => x !== undefined && x !== '').join('\n');
}

function checklist() {
  const order = ['building', 'shaped', 'inbox', 'parked'];
  const out = [`## ${S.ed.symbol} ${S.ed.name} — ${ideas().filter(isPending).length} pending`];
  for (const k of order) {
    const s = stageOf(k);
    const list = ideas().filter(i => i.status === k).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    if (!list.length) continue;
    out.push('', `### ${s.icon} ${s.name} (${list.length})`);
    for (const i of list) {
      const c = i.challenge && chById(i.challenge);
      const tags = [TYPES[i.type] && `${TYPES[i.type].icon} ${TYPES[i.type].name}`, groupOf(i) && '▤ ' + groupOf(i), HOMES[i.home] && `${HOMES[i.home].icon} ${HOMES[i.home].name}`, PRIO[i.priority]?.icon, c && c.n && `🧗 C#${c.n}`].filter(Boolean);
      out.push(`- [ ] #${i.n} **${nameOf(i)}**${i.summary ? ' — ' + i.summary : ''} _(${tags.join(' · ') || 'unshaped'})_`);
    }
  }
  const open = chs().filter(c => c.status === 'open').sort((a, b) => heat(b) - heat(a));
  if (open.length) {
    out.push('', `### 🧗 Open challenges (${open.length})`);
    for (const c of open) out.push(`- [ ] C#${c.n} **${cname(c)}** _(${OFTEN[c.often] || ''} · ${c.impact} impact · ×${c.hits || 1})_`);
  }
  const t = tray(), n = t.ideas.length + t.chs.length;
  if (n) out.push('', `_✨ ${n} suggestion${n > 1 ? 's' : ''} waiting to be kept or dismissed._`);
  return out.join('\n');
}

// ---------- Drag and drop (pointer-based, so it feels the same everywhere) ----------
// Lists say what a drop means: s:<stage> (reorder/move), q:<impact>:<effort> or q:none (matrix), g:<n> (group).
let drag = null;
const board = $('#board');

board.addEventListener('pointerdown', e => {
  const card = e.target.closest('.card[data-id]');
  if (!card || e.button !== 0 || e.target.closest('button,input,label,a,textarea,[data-goto],[data-gochal],[data-group]')) return;
  drag = {card, id:card.dataset.id, sx:e.clientX, sy:e.clientY, started:false};
});

window.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
    startDrag();
  }
  moveDrag();
});

window.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag;
  if (!d.started) {
    drag = null;
    if (S.selecting) togglePick(d.id); else openDrawer(d.id);
    return;
  }
  endDrag();
});

function startDrag() {
  const r = drag.card.getBoundingClientRect();
  drag.started = true;
  drag.dx = drag.sx - r.left; drag.dy = drag.sy - r.top;
  drag.from = drag.card.closest('.list').dataset.drop;
  const g = drag.card.cloneNode(true);
  g.classList.add('ghost'); g.classList.remove('flash');
  g.style.width = r.width + 'px';
  document.body.appendChild(g);
  drag.ghost = g;
  const ph = document.createElement('div');
  ph.className = 'placeholder'; ph.style.height = r.height + 'px';
  drag.card.before(ph);
  drag.card.style.display = 'none';
  drag.ph = ph;
  document.body.classList.add('dragging');
  drag.raf = requestAnimationFrame(autoScroll);
}

function moveDrag() {
  const {ghost, ph} = drag;
  ghost.style.left = (drag.x - drag.dx) + 'px';
  ghost.style.top = (drag.y - drag.dy) + 'px';
  const el = document.elementFromPoint(drag.x, drag.y);
  const col = el && el.closest('.col');
  const list = col && $('.list[data-drop]', col);
  $$('.col.over').forEach(c => c !== col && c.classList.remove('over'));
  if (!list) return;
  col.classList.add('over');
  const cards = $$('.card', list).filter(c => c !== drag.card);
  const before = cards.find(c => { const r = c.getBoundingClientRect(); return drag.y < r.top + r.height / 2; });
  $('.empty', list)?.remove();
  ph.style.setProperty('--c', col.style.getPropertyValue('--c'));
  if (before) { if (ph.nextSibling !== before) list.insertBefore(ph, before); }
  else if (list.lastElementChild !== ph) list.appendChild(ph);
}

function autoScroll() {
  if (!drag || !drag.started) return;
  const b = board.getBoundingClientRect(), edge = 60;
  if (drag.x < b.left + edge) board.scrollLeft -= 14; else if (drag.x > b.right - edge) board.scrollLeft += 14;
  const list = drag.ph.parentElement;
  if (list) {
    const r = list.getBoundingClientRect();
    if (drag.y < r.top + 40) list.scrollTop -= 10; else if (drag.y > r.bottom - 40) list.scrollTop += 10;
  }
  drag.raf = requestAnimationFrame(autoScroll);
}

function endDrag() {
  const d = drag; drag = null;
  cancelAnimationFrame(d.raf);
  document.body.classList.remove('dragging');
  $$('.col.over').forEach(c => c.classList.remove('over'));
  const list = d.ph.parentElement;
  const to = list.dataset.drop || '';
  const i = byId(d.id);
  // New order = the visible order of the target column with the card at the placeholder.
  const ids = [...list.children].filter(el => el !== d.card).map(el => el === d.ph ? d.id : el.dataset && el.dataset.id).filter(Boolean);
  const gr = d.ph.getBoundingClientRect();
  d.ghost.style.transition = 'left .16s ease-out, top .16s ease-out, transform .16s ease-out';
  d.ghost.style.left = gr.left + 'px'; d.ghost.style.top = gr.top + 'px'; d.ghost.style.transform = 'none';
  setTimeout(() => {
    d.ghost.remove();
    if (i && to !== d.from || i && to.startsWith('s:')) drop(i, to, ids, d, gr);
    if (S.deferred) { const s = S.deferred; S.deferred = null; forge.load(s); } else render();
  }, 170);
}

function drop(i, to, ids, d, gr) {
  const [kind, a, b] = to.split(':');
  if (kind === 's') {
    if (i.status !== a) setStatus(i, a);
    // Hidden (filtered) cards keep their place after the visible ones.
    const hidden = ideas().filter(x => x.status === a && !ids.includes(x.id)).sort((x, y) => (x.order ?? 0) - (y.order ?? 0));
    [...ids.map(byId).filter(Boolean), ...hidden].forEach((x, k) => { x.order = k; });
    if (a === 'shipped' && d.from !== 's:shipped') confetti(gr.left + gr.width / 2, gr.top + 20);
  } else if (kind === 'q') {
    if (a === 'none') { delete i.impact; delete i.effort; delete i.placeWhy; }
    else { i.impact = a; i.effort = b; delete i.placeWhy; }
  } else if (kind === 'g') {
    const g = groupKeys[+a] ?? '';
    i.group = g;
    if (!g && i.app) toast(`Still shown under ${i.app} — clear "For app" to ungroup it`);
    else if (g) toast(`▤ Filed #${i.n} under ${g}`);
  } else return;
  touch(i);
  save();
}

function confetti(x, y) {
  const colors = ['#f59e0b', '#8b5cf6', '#10b981', '#3b82f6', '#ef4444', '#ec4899'];
  for (let k = 0; k < 42; k++) {
    const b = document.createElement('i');
    b.className = 'bit';
    const a = Math.random() * Math.PI * 2, r = 60 + Math.random() * 130;
    b.style.cssText = `left:${x}px;top:${y}px;background:${colors[k % colors.length]};--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r + 90}px;--r:${Math.random() * 720 - 360}deg`;
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1200);
  }
  toast('🚀 Shipped — nice work!');
}

function togglePick(id) { S.picked.has(id) ? S.picked.delete(id) : S.picked.add(id); render(); }

function bulk(status) {

// ---------- Toast ----------
let toastTimer;
function toast(text, fn, label = 'Undo') {
  const t = $('#toast');
  t.replaceChildren(Object.assign(document.createElement('span'), {textContent:text}));
  if (fn) { const b = Object.assign(document.createElement('button'), {textContent:label}); b.onclick = () => { fn(); t.classList.remove('on'); }; t.append(b); }
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), fn ? 6000 : 2400);
}

$('#setBtn').onclick = e => { e.stopPropagation(); togglePop('setPop'); };
$('#binBtn').onclick = e => { e.stopPropagation(); togglePop('binPop'); };
$('#trayBtn').onclick = e => { e.stopPropagation(); togglePop('trayPop'); };
$('#capBtn').onclick = capturePage;
$('#findBtn').onclick = findChallenges;
$('#aiBanner').onclick = e => { e.stopPropagation(); forge.openSettings(); };
$('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); };
$('#viewSeg').onclick = e => { const b = e.target.closest('[data-view]'); if (b) { S.view = b.dataset.view; localStorage.view = S.view; render(); } };
$('#nextBtn').onclick = e => { e.stopPropagation(); $('#nextPop').classList.contains('on') ? togglePop('nextPop') : (S.doc.next && !S.nextErr ? togglePop('nextPop') : whatNext()); };
$('#nextPop').addEventListener('click', e => {
  const r = e.target.closest('[data-open]'); if (r) { $('#nextPop').classList.remove('on'); openDrawer(r.dataset.open); }
  if (e.target.closest('[data-renext]')) { e.preventDefault(); whatNext(); }
});
function gotoIdea(n) { const x = ideas().find(i => i.n === n); if (x) { if (x.status === 'removed') toast(`#${n} is in the bin`); else openDrawer(x.id); } }
function gotoChallenge(id) { const c = chById(id); if (!c) return; $$('.pop').forEach(p => p.classList.remove('on')); openChallenge(id); }
$('#scrim').onclick = closeDrawer;

function hitAgain(c) {
  const was = {hits:c.hits || 1, lastHit:c.lastHit};
  c.hits = was.hits + 1; c.lastHit = now(); touch(c); flashIds.add(c.id);
  save(); render();
  toast(`🧗 C#${c.n} hit ×${c.hits}`, () => { c.hits = was.hits; c.lastHit = was.lastHit; save(); render(); });
}

board.addEventListener('change', e => { if (e.target.dataset.pick) togglePick(e.target.dataset.pick); });
board.addEventListener('click', e => {
  const r = e.target.closest('[data-retry]');
  if (r) { const i = byId(r.dataset.retry); if (i) shape(i, !!i.shapedAt); return; }
  const cr = e.target.closest('[data-chretry]');
  if (cr) { const c = chById(cr.dataset.chretry); if (c) shapeChallenge(c); return; }
  const g = e.target.closest('[data-goto]');
  if (g) { gotoIdea(+g.dataset.goto); return; }
  const gc = e.target.closest('[data-gochal]');
  if (gc) { gotoChallenge(gc.dataset.gochal); return; }
  const gp = e.target.closest('[data-group]');
  if (gp) { S.fGroup = S.fGroup === gp.dataset.group ? '' : gp.dataset.group; renderAll(); return; }
  const h = e.target.closest('[data-hit]');
  if (h) { const c = chById(h.dataset.hit); if (c) hitAgain(c); return; }
  const sp = e.target.closest('[data-spark]');
  if (sp) { const c = chById(sp.dataset.spark); if (c) spark(c); return; }
  const pl = e.target.closest('[data-place]');
  if (pl) { placeAll(pl.dataset.place === 'all'); return; }
  if (e.target.closest('[data-newgroup]')) {
    const name = (prompt('Name the group — an agent you want to build, or one of your apps:') || '').trim();
    if (!name) return;
    S.newGroups = [...new Set([...(S.newGroups || []), name])];
    S.view = 'groups'; render();
    toast(`▤ ${name} — drag ideas onto it, or add one with the filter set to it`);
    return;
  }
  const ch = e.target.closest('.card[data-chid]');
  if (ch && !e.target.closest('button')) openChallenge(ch.dataset.chid);
});
board.addEventListener('keydown', e => {
  const c = e.target.closest('.card');
  if (!c || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault();
  if (c.dataset.chid) openChallenge(c.dataset.chid);
  else S.selecting ? togglePick(c.dataset.id) : openDrawer(c.dataset.id);
});

document.addEventListener('click', e => {
  if (!e.target.closest('.pop') && !e.target.closest('#setBtn,#binBtn,#nextBtn,#trayBtn,#aiBanner')) $$('.pop').forEach(p => p.classList.remove('on'));
  // Links open in the browser (the app only opens http and https).
  const a = e.target.closest('a[href]');
  if (a && !a.matches('[href="#"]')) { e.preventDefault(); if (safeUrl(a.getAttribute('href'))) post({cmd:'open', url:a.getAttribute('href')}); }
});

// Tray
$('#trayPop').addEventListener('click', e => {
  const k = e.target.closest('[data-keep]'), d = e.target.closest('[data-dismiss]'), pk = e.target.closest('[data-peek]');
  const gc = e.target.closest('[data-gochal]');
  if (k) { const i = byId(k.dataset.keep), c = chById(k.dataset.keep); if (i) keepIdea(i); if (c) keepChallenge(c); save(); renderAll(); return; }
  if (d) { const i = byId(d.dataset.dismiss), c = chById(d.dataset.dismiss); if (i) dismissIdea(i); if (c) dismissChallenge(c); save(); renderAll(); return; }
  if (gc) { gotoChallenge(gc.dataset.gochal); return; }
  if (pk) { $('#trayPop').classList.remove('on'); byId(pk.dataset.peek) ? openDrawer(pk.dataset.peek) : openChallenge(pk.dataset.peek); return; }
  if (e.target.closest('[data-keepall]')) { const t = tray(); t.chs.forEach(keepChallenge); t.ideas.forEach(keepIdea); save(); renderAll(); toast(`✨ Kept ${t.chs.length + t.ideas.length}`); }
  if (e.target.closest('[data-dismissall]')) {
    const before = JSON.stringify(S.doc), t = tray();
    t.chs.forEach(dismissChallenge); t.ideas.forEach(i => byId(i.id) && dismissIdea(i)); save(); renderAll();
    toast('Dismissed all suggestions', () => { S.doc = JSON.parse(before); save(); renderAll(); });
  }
});

// Settings popover
$('#setPop').addEventListener('click', e => {
  const b = e.target.closest('[data-setting] button');
  if (b) { const key = b.parentElement.dataset.setting; S.settings[key] = b.dataset.v; post({cmd:'setting', key, value:b.dataset.v}); renderSettings(); }
  const prov = () => S.ai.provider;
  if (e.target.closest('[data-aikey]')) { const v = $('#aiKey').value.trim(); if (v) { post({cmd:'ai', provider:prov(), key:'apiKey', value:v}); $('#aiKey').value = ''; toast('🔑 Key saved in Keychain'); } }
  if (e.target.closest('[data-aikeyclear]') && confirm('Forget the saved key?')) post({cmd:'ai', provider:prov(), key:'apiKey', value:null});
  if (e.target.closest('[data-aibase]')) post({cmd:'ai', provider:prov(), key:'base', value:$('#aiBase').value.trim()});
  if (e.target.closest('[data-airefresh]')) { S.ai.loading = true; renderSettings(); post({cmd:'ai', provider:prov(), key:'refresh'}); }
  if (e.target.closest('[data-aimodel]')) { const v = $('#aiModel').value.trim(); if (v) post({cmd:'ai', provider:prov(), key:'model', value:v}); }
  if (e.target.closest('[data-aitest]')) { S.testing = true; S.testResult = null; renderSettings(); post({cmd:'ai', provider:prov(), key:'test'}); }
  const pd = e.target.closest('[data-pdel]');
  if (pd) { const p = [...(S.settings.people || [])]; p.splice(+pd.dataset.pdel, 1); S.settings.people = p; post({cmd:'setting', key:'people', value:p}); renderSettings(); }
  if (e.target.closest('[data-reveal]')) post({cmd:'reveal'});
  if (e.target.closest('[data-folder]')) post({cmd:'chooseFolder'});
  if (e.target.closest('[data-folderreset]')) post({cmd:'chooseFolder', reset:true});
  if (e.target.closest('[data-update]')) post({cmd:'checkUpdate'});
});
$('#setPop').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.ai === 'provider') { S.testResult = null; post({cmd:'ai', provider:t.value, key:'provider'}); return; }
  if (t.dataset.ai === 'model') {
    if (t.value === '__other') { $('#otherModel').hidden = false; $('#aiModel').focus(); return; }
    post({cmd:'ai', provider:S.ai.provider, key:'model', value:t.value}); return;
  }
  const k = t.dataset.toggle; if (!k) return;
  S.settings[k] = t.checked; post({cmd:'setting', key:k, value:t.checked});
  if (k === 'autoShape') renderFilters();
  if (k === 'pageReading' || k === 'hotkeys') { renderTabs(); renderSettings(); }
});
$('#setPop').addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset.pin !== undefined && t.value.trim()) {
    const p = [...(S.settings.people || [])], v = t.value.trim();
    if (!p.some(x => x.toLowerCase() === v.toLowerCase())) p.push(v);
    S.settings.people = p; post({cmd:'setting', key:'people', value:p}); renderSettings(); $('[data-pin]').focus();
  }
  if (e.key === 'Enter' && t.id === 'aiKey') $('[data-aikey]').click();
  if (e.key === 'Enter' && t.id === 'aiBase') $('[data-aibase]').click();
  if (e.key === 'Enter' && t.id === 'aiModel') $('[data-aimodel]').click();
});

// Bin
$('#binPop').addEventListener('click', e => {
  const r = e.target.closest('[data-restore]'), p = e.target.closest('[data-purge]');
  if (r) {
    const i = byId(r.dataset.restore), c = chById(r.dataset.restore);
    if (i) { setStatus(i, i.prevStatus && i.prevStatus !== 'removed' ? i.prevStatus : 'inbox'); delete i.removedAt; flashIds.add(i.id); toast('↩︎ Restored: ' + nameOf(i)); }
    if (c) { c.status = 'open'; delete c.removedAt; touch(c); flashIds.add(c.id); toast(`↩︎ Restored C#${c.n}`); }
    save(); render(); renderBin();
  }
  if (p) { S.doc.ideas = ideas().filter(i => i.id !== p.dataset.purge); S.doc.challenges = chs().filter(c => c.id !== p.dataset.purge); save(); render(); renderBin(); }
  if (e.target.closest('[data-purgeall]') && confirm('Delete everything in the bin forever?')) {
    S.doc.ideas = ideas().filter(i => i.status !== 'removed');
    const gone = new Set(chs().filter(c => c.status === 'dismissed').map(c => c.id));
    S.doc.challenges = chs().filter(c => !gone.has(c.id));
    for (const i of ideas()) if (gone.has(i.challenge)) i.challenge = '';
    save(); render(); renderBin();
  }
});

// Drawer editing (ideas and challenges)
const drawer = $('#drawer');
const openIdea = () => S.openKind === 'idea' ? byId(S.open) : null;
const openCh = () => S.openKind === 'challenge' ? chById(S.open) : null;
drawer.addEventListener('input', e => {
  const t = e.target, i = openIdea(), c = openCh();
  if (c && t.dataset.cf) { c[t.dataset.cf] = t.value; touch(c); if (t.classList.contains('d-title')) autosize(t); save(true); render(); return; }
  if (t.dataset.of) { const x = i || c; if (!x) return; x.origin = Object.assign({by:originOf(x)}, x.origin, {[t.dataset.of]:t.value}); touch(x); save(true); render(); return; }
  if (!i) return;
  if (t.dataset.f) {
    i[t.dataset.f] = t.value; touch(i);
    if (t.dataset.f === 'app' && !i.home && appHome(t.value)) { i.home = appHome(t.value); renderDrawer(); $('#dApp').focus(); }
    if (t.classList.contains('d-title')) autosize(t);
    save(true); render();
  } else if (t.dataset.steptext !== undefined) {
    i.steps[+t.dataset.steptext].t = t.value; touch(i); save(true); render();
  }
});
drawer.addEventListener('change', e => {
  const t = e.target, i = openIdea();
  if (!i) return;
  if (t.dataset.step !== undefined) { i.steps[+t.dataset.step].done = t.checked; touch(i); save(); render(); renderDrawer(); }
  if (t.dataset.f === 'app' || t.dataset.f === 'group') { i[t.dataset.f] = t.value.trim(); save(); renderFilters(); render(); }
  if (t.dataset.chal !== undefined) { i.challenge = t.value; touch(i); save(); render(); renderDrawer(); }
});
drawer.addEventListener('keydown', e => {
  const i = openIdea(), t = e.target;
  if (e.key === 'Enter' && t.classList.contains('d-title')) { e.preventDefault(); t.blur(); return; }
  if (!i) return;
  if (e.key === 'Enter' && t.id === 'newStep' && t.value.trim()) {
    i.steps.push({t:t.value.trim(), done:false}); touch(i); save(); render(); renderDrawer(); $('#newStep').focus();
  }
  if (e.key === 'Enter' && t.dataset.tokin && t.value.trim()) {
    const f = t.dataset.tokin, v = t.value.trim().replace(/,$/, '');
    if (!i[f].some(x => x.toLowerCase() === v.toLowerCase())) i[f].push(v);
    touch(i); save(); render(); renderDrawer(); $(`[data-tokin="${f}"]`).focus();
  }
  if (e.key === 'Backspace' && t.dataset.tokin && !t.value && i[t.dataset.tokin].length) {
    const f = t.dataset.tokin; i[f].pop(); touch(i); save(); render(); renderDrawer(); $(`[data-tokin="${f}"]`).focus();
  }
  if (e.key === 'Enter' && t.id === 'askQ' && !e.isComposing) { e.preventDefault(); ask(i, t.value); }
});
drawer.addEventListener('click', e => {
  if (e.target.closest('[data-act="close"]')) { closeDrawer(); return; }
  const gc = e.target.closest('[data-gochal]');
  if (gc) { e.preventDefault(); gotoChallenge(gc.dataset.gochal); return; }
  const go = e.target.closest('[data-goto]');
  if (go) { gotoIdea(+go.dataset.goto); return; }
  const segBtn = e.target.closest('[data-seg] button');
  if (segBtn && segBtn.parentElement.dataset.seg === 'origin') {
    const x = openIdea() || openCh(), v = segBtn.dataset.v;
    x.origin = v === 'you' ? undefined : Object.assign({}, x.origin, {by:v});
    if (!x.origin) delete x.origin;
    touch(x); save(); render(); renderDrawer(); return;
  }
  return openIdea() ? ideaClick(e, openIdea(), segBtn) : openCh() ? chClick(e, openCh(), segBtn) : null;
});

function ideaClick(e, i, segBtn) {
  if (segBtn) {
    const f = segBtn.parentElement.dataset.seg, v = segBtn.dataset.v;
    if (f === 'status') { const was = i.status; setStatus(i, v); if (v === 'shipped' && was !== 'shipped') { const r = segBtn.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top); } }
    else if (f === 'impact' || f === 'effort') {
      if (i[f] === v) { delete i.impact; delete i.effort; }
      else { i[f] = v; if (!i.impact) i.impact = 'high'; if (!i.effort) i.effort = 'low'; }
      delete i.placeWhy; touch(i);
    }
    else { i[f] = i[f] === v && f !== 'priority' ? '' : v; touch(i); }
    save(); render(); renderDrawer(); return;
  }
  const sd = e.target.closest('[data-stepdel]');
  if (sd) { i.steps.splice(+sd.dataset.stepdel, 1); touch(i); save(); render(); renderDrawer(); return; }
  const td = e.target.closest('[data-tokdel]');
  if (td) { const f = td.closest('[data-tokens]').dataset.tokens; i[f].splice(+td.dataset.tokdel, 1); touch(i); save(); render(); renderDrawer(); return; }
  const ab = e.target.closest('[data-ask]');
  if (ab) { ask(i, ASKS[+ab.dataset.ask][2]); return; }
  const cd = e.target.closest('[data-chatdel]');
  if (cd) { i.chat.splice(+cd.dataset.chatdel, 1); save(); renderDrawer(); return; }
  const us = e.target.closest('[data-usesteps]');
  if (us) {
    const c = i.chat[+us.dataset.usesteps], old = i.steps;
    i.steps = c.steps.map(t => ({t, done:false})); touch(i); save(); render(); renderDrawer();
    toast(`🧭 ${c.steps.length} build steps set`, () => { i.steps = old; save(); render(); renderDrawer(); });
    return;
  }
  const btn = e.target.closest('[data-act]'), act = btn?.dataset.act;
  if (act === 'keep') { keepIdea(i); save(); renderAll(); renderDrawer(); toast(`✨ Kept as #${i.n}`); }
  if (act === 'dismiss') { dismissIdea(i); save(); closeDrawer(); renderAll(); }
  if (act === 'ask') ask(i, $('#askQ').value);
  if (act === 'build') {
    if (i.status === 'suggested') keepIdea(i);
    post({cmd:'build', brief:brief(i), app:i.app || '', n:i.n, tool:btn.dataset.tool});
    if (i.status === 'inbox' || i.status === 'shaped') setStatus(i, 'building');
    flashIds.add(i.id);
    save(); closeDrawer(); render();
  }
  if (act === 'auto') {
    // First click asks where; a second click within 5 seconds starts it.
    clearTimeout(S.autoConfirmT);
    if (S.autoConfirm !== i.id) {
      S.autoConfirm = i.id; renderDrawer();
      S.autoConfirmT = setTimeout(() => { S.autoConfirm = null; if (S.open === i.id) renderDrawer(); }, 5000);
      return;
    }
    S.autoConfirm = null;
    autoBuild(i);
  }
  if (act === 'deploy') {
    clearTimeout(S.autoConfirmT);
    const key = 'deploy:' + i.id;
    if (S.autoConfirm !== key) {
      S.autoConfirm = key; renderDrawer();
      S.autoConfirmT = setTimeout(() => { S.autoConfirm = null; if (S.open === i.id) renderDrawer(); }, 5000);
      return;
    }
    S.autoConfirm = null;
    deployIt(i);
  }
  if (act === 'autostop') { post({cmd:'autoStop', id:i.id}); toast(deploying(i) ? '⏹ Stopping the deploy…' : '⏹ Stopping the build…'); }
  if (act === 'autoresume') post({cmd:'autoResume', session:(i.auto.deploy && i.auto.deploy.session) || i.auto.session, dir:i.auto.dir, n:i.n});
  if (act === 'reshape') { shape(i, true); renderDrawer(); }
  if (act === 'brief') { post({cmd:'copy', text:brief(i)}); toast('📋 Brief copied — paste it to whoever can help'); }
  if (act === 'issue') {
    const app = S.apps.find(a => a.name.toLowerCase() === (i.app || '').toLowerCase());
    const repo = app && safeUrl(app.repo);
    if (repo) post({cmd:'open', url:`${repo.replace(/\/$/, '')}/issues/new?title=${encodeURIComponent(nameOf(i))}&body=${encodeURIComponent(brief(i))}`});
  }
  if (act === 'remove') {
    const prev = i.status, order = i.order;
    if (autoRunning(i)) post({cmd:'autoStop', id:i.id});
    setStatus(i, 'removed'); save(); closeDrawer(); render();
    toast('🗑 Removed: ' + nameOf(i), () => { i.status = prev; i.order = order; delete i.removedAt; save(); render(); });
  }
}

function chClick(e, c, segBtn) {
  if (segBtn) {
    const f = segBtn.parentElement.dataset.seg, v = segBtn.dataset.v;
    if (f === 'cstatus') { c.status = v; if (v === 'solved') c.solvedAt = now(); else delete c.solvedAt; }
    if (f === 'cimpact') c.impact = v;
    if (f === 'coften') c.often = v;
    touch(c); save(); render(); renderDrawer(); return;
  }
  const lk = e.target.closest('.linked[data-open]');
  if (lk) { openDrawer(lk.dataset.open); return; }
  const k = e.target.closest('[data-keep]'), dm = e.target.closest('[data-dismiss]');
  if (k) { const i = byId(k.dataset.keep); if (i) { keepIdea(i); save(); renderAll(); renderDrawer(); toast(`✨ Kept as #${i.n}`); } return; }
  if (dm) { const i = byId(dm.dataset.dismiss); if (i) { dismissIdea(i); save(); renderAll(); renderDrawer(); } return; }
  const pk = e.target.closest('[data-peek]');
  if (pk) { openDrawer(pk.dataset.peek); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'keep') { keepChallenge(c); save(); renderAll(); renderDrawer(); toast(`🧗 Kept as C#${c.n}`); }
  if (act === 'dismiss') { dismissChallenge(c); save(); closeDrawer(); renderAll(); }
  if (act === 'hit') { c.hits = (c.hits || 1) + 1; c.lastHit = now(); touch(c); save(); render(); renderDrawer(); }
  if (act === 'hitminus') { c.hits = Math.max(1, (c.hits || 1) - 1); touch(c); save(); render(); renderDrawer(); }
  if (act === 'spark') spark(c);
  if (act === 'ownidea') {
    const i = newIdea({title:'', raw:'', challenge:c.id, status:'inbox'});
    ideas().push(i); flashIds.add(i.id); save(); render(); openDrawer(i.id);
  }
  if (act === 'chreshape') { shapeChallenge(c); renderDrawer(); }
  if (act === 'chcopy') { post({cmd:'copy', text:chText(c)}); toast('📋 Challenge copied'); }
  if (act === 'chremove') {
    const prev = c.status;
    c.status = 'dismissed'; c.removedAt = now(); touch(c); save(); closeDrawer(); render();
    toast(`🗑 Removed C#${c.n}`, () => { c.status = prev; delete c.removedAt; save(); render(); });
  }
}

document.addEventListener('keydown', e => {
  const typing = e.target.closest('input,textarea,select');
  if (e.key === 'Escape') {
    if ($$('.pop.on').length) $$('.pop').forEach(p => p.classList.remove('on'));
    else if (S.open) closeDrawer();
    else if (S.selecting) { S.selecting = false; S.picked.clear(); render(); }
    else if (typing) e.target.blur();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'n') { e.preventDefault(); forge.focusCapture(); }
  if (['1', '2', '3'].includes(e.key) && !S.open) setTab(['ideas', 'challenges', 'matrix'][+e.key - 1]);
});

// Opened in a plain browser (no app around it): show the demo board so the page can be previewed.
if (!window.webkit?.messageHandlers?.forge) {
  fetch('demo.json').then(r => r.json()).then(doc => forge.load({doc, demo:true, apps:[], settings:{}})).catch(() => forge.load({doc:{ideas:[]}}));
} else {
  post({cmd:'ready'});
}
</script>
