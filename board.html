<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Idea Forge</title>
<style>
:root{
  --bg:#f4f5f9; --panel:#ffffff; --col:#eaecf3; --line:#dfe2ea; --line2:#cfd3de;
  --text:#161922; --dim:#535a6d; --faint:#7d8496;
  --accent:#f59e0b; --accent-ink:#9a5800; --accent-fill:#b45309; --accent-soft:#fff3db;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 2px 8px rgba(20,24,40,.05);
  --shadow-up:0 6px 18px rgba(20,24,40,.10),0 2px 6px rgba(20,24,40,.06);
  --ghost:0 22px 50px rgba(20,24,40,.25),0 6px 14px rgba(20,24,40,.12);
  --inbox:#64748b; --shaped:#8b5cf6; --building:#f59e0b; --shipped:#10b981; --parked:#0ea5e9;
  --t-agent:#8b5cf6; --t-enhancement:#3b82f6; --t-fix:#ef4444; --t-chore:#64748b; --t-none:#c3c8d4;
  --chip:#f1f3f8; --input:#f7f8fb; --overlay:rgba(16,18,28,.28);
  --radius:12px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  font-size:13px; color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0f15; --panel:#171a23; --col:#12151d; --line:#262a36; --line2:#323746;
    --text:#e9ecf3; --dim:#a3a9b9; --faint:#7a8195;
    --accent-ink:#fbbf24; --accent-soft:#2b2110;
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-up:0 8px 22px rgba(0,0,0,.45);
    --ghost:0 24px 60px rgba(0,0,0,.6);
    --t-none:#3d4252; --chip:#1f232e; --input:#11141b; --overlay:rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;padding-top:26px}
/* The top 26px sit under the window's title bar: the app lays a drag strip over them. */
input,textarea,[contenteditable]{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}

/* ---------- Header ---------- */
.top{display:flex;align-items:center;gap:14px;padding:12px 20px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(145deg,#fde68a,#f59e0b 55%,#d97706);box-shadow:0 4px 14px rgba(245,158,11,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px}
.stats{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.stat{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
.stat i{width:7px;height:7px;border-radius:50%;display:inline-block}
.stat+.stat::before{content:"·";margin-right:1px;color:var(--faint)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{position:relative}
.search input{width:220px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  padding:0 30px 0 30px;font:inherit;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.search::before{content:"⌕";position:absolute;left:10px;top:6px;font-size:15px;color:var(--faint)}
.search kbd{position:absolute;right:8px;top:8px;font:10px ui-monospace,monospace;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px}
select.pill{height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;padding:0 26px 0 10px;
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 13px) 14px,calc(100% - 9px) 14px;background-size:4px 4px;background-repeat:no-repeat;outline:none}
select.pill.on{border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);padding:0 12px;display:inline-flex;align-items:center;gap:6px;
  font-weight:500;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--chip)}
.btn:active{transform:translateY(1px)}
.btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent-fill)}
.btn.icon{width:32px;padding:0;justify-content:center;font-size:15px}
.btn.danger{color:#dc2626}
@media (prefers-color-scheme: dark){.btn.danger{color:#f87171}}

/* ---------- Capture ---------- */
.capture{margin:2px 20px 12px;border-radius:14px;padding:1.5px;
  background:linear-gradient(110deg,color-mix(in srgb,var(--accent) 70%,transparent),color-mix(in srgb,var(--shaped) 60%,transparent) 55%,color-mix(in srgb,var(--t-enhancement) 50%,transparent))}
.capture-in{background:var(--panel);border-radius:12.5px;display:flex;align-items:flex-end;gap:12px;padding:10px 10px 10px 14px}
.capture textarea{flex:1;border:0;outline:none;resize:none;background:transparent;color:var(--text);font-family:inherit;font-size:14px;line-height:1.45;
  min-height:22px;max-height:160px;padding:4px 0}
.capture textarea::placeholder{color:var(--faint)}
.capture .opts{display:flex;align-items:center;gap:10px}
.hint{font-size:11px;color:var(--faint)}

/* ---------- Switch ---------- */
.sw{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:var(--dim);white-space:nowrap}
.sw input{display:none}
.sw b{width:30px;height:18px;border-radius:9px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.sw b::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked+b{background:var(--accent-fill)}
.sw input:checked+b::after{transform:translateX(12px)}
.sw input:disabled+b{opacity:.45}

/* ---------- Board ---------- */
.board{flex:1;display:flex;gap:14px;padding:0 20px 18px;overflow-x:auto;overflow-y:hidden;min-height:0}
.col{flex:1 0 236px;max-width:380px;display:flex;flex-direction:column;background:var(--col);border-radius:14px;min-height:0;
  border:1px solid transparent;transition:border-color .15s,background .15s}
.col.over{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 7%,var(--col))}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.col-h .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.col-h h2{margin:0;font-size:13px;font-weight:650}
.col-h .count{margin-left:auto;min-width:22px;height:20px;border-radius:10px;padding:0 7px;display:grid;place-items:center;font-size:11px;font-weight:650;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--text))}
.col-sub{font-size:11px;color:var(--faint);padding:0 14px 8px;margin-top:-4px}
.list{flex:1;overflow-y:auto;padding:4px 10px 14px;display:flex;flex-direction:column;gap:9px;min-height:60px}
.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px;border:2px solid var(--col)}
.empty{border:1.5px dashed var(--line2);border-radius:var(--radius);padding:18px 10px;text-align:center;color:var(--faint);font-size:12px}
.placeholder{border:2px dashed color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:var(--radius);flex:none}

/* ---------- Card ---------- */
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px 10px 15px;box-shadow:var(--shadow);
  cursor:grab;transition:box-shadow .15s,transform .15s,border-color .15s;flex:none;animation:pop .25s ease-out}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3.5px;border-radius:0 3px 3px 0;background:var(--tc,var(--t-none))}
.card:hover{box-shadow:var(--shadow-up);transform:translateY(-1px);border-color:var(--line2)}
.card.flash{animation:flash 1.2s ease-out}
.card.picked{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent),var(--shadow)}
.card.t-agent{--tc:var(--t-agent)}.card.t-enhancement{--tc:var(--t-enhancement)}.card.t-fix{--tc:var(--t-fix)}.card.t-chore{--tc:var(--t-chore)}
.card-top{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-bottom:5px}
.ref{font:600 10.5px ui-monospace,SFMono-Regular,monospace;color:var(--faint)}
.type{font-weight:600;color:color-mix(in srgb,var(--tc,var(--faint)) 70%,var(--text))}
.prio{margin-left:auto;font-size:12px}
.pick{display:none;margin-left:6px}
.selecting .pick{display:inline-flex}
.pick input{width:15px;height:15px;accent-color:var(--accent-fill);margin:0;cursor:pointer}
.card h3{margin:0;font-size:13.5px;font-weight:620;line-height:1.35;letter-spacing:-.1px;word-break:break-word}
.card .sum{margin:4px 0 0;color:var(--dim);font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:9px}
.chip{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--dim);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.h-personal{background:color-mix(in srgb,var(--shipped) 14%,transparent);color:color-mix(in srgb,var(--shipped) 60%,var(--text))}
.chip.h-work{background:color-mix(in srgb,var(--t-enhancement) 14%,transparent);color:color-mix(in srgb,var(--t-enhancement) 60%,var(--text))}
.chip.h-local{background:color-mix(in srgb,var(--t-chore) 16%,transparent)}
.chip.h-none{border:1px dashed var(--line2);background:transparent;color:var(--faint)}
.helpers{display:flex;margin-left:auto}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;border:2px solid var(--panel);margin-left:-6px}
.av:first-child{margin-left:0}
.progress{display:flex;align-items:center;gap:8px;margin-top:9px}
.progress .bar{flex:1;height:4px;border-radius:2px;background:var(--chip);overflow:hidden}
.progress .bar b{display:block;height:100%;border-radius:2px;background:var(--tc,var(--accent));transition:width .3s}
.progress span{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.when{font-size:10.5px;color:var(--faint);margin-top:7px}
.card.shaping{cursor:progress}
.card.shaping h3,.card.shaping .sum{opacity:.55}
.shimmer{margin-top:8px;font-size:11.5px;font-weight:600;color:var(--shaped);display:flex;align-items:center;gap:7px}
.shimmer::after{content:"";flex:1;height:5px;border-radius:3px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--shaped) 45%,transparent),transparent);
  background-size:200% 100%;animation:shim 1.2s linear infinite}
.err{margin-top:8px;font-size:11.5px;color:#dc2626;display:flex;gap:6px;align-items:baseline}
.err button{border:0;background:none;color:var(--accent-ink);font-weight:600;padding:0;text-decoration:underline}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(2.2deg) scale(1.03);box-shadow:var(--ghost);cursor:grabbing;animation:none;transition:none;opacity:.97}
body.dragging,body.dragging *{cursor:grabbing!important}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}}
@keyframes flash{0%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:var(--shadow)}}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,92vw);background:var(--panel);border-left:1px solid var(--line);z-index:31;
  transform:translateX(104%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.15)}
.drawer.on{transform:none}
.d-head{display:flex;align-items:center;gap:8px;padding:14px 18px 6px;font-size:11.5px;color:var(--faint)}
.d-head .btn{margin-left:auto}
.d-body{flex:1;overflow-y:auto;padding:4px 18px 18px}
.d-title{width:100%;border:0;outline:none;background:transparent;font-family:inherit;font-size:19px;font-weight:700;line-height:1.3;color:var(--text);padding:4px 0;resize:none}
.field{margin-top:14px}
.field>label,.field>.lbl{display:block;font-size:10.5px;font-weight:650;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.field textarea,.field input[type=text]{width:100%;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13px;line-height:1.45;color:var(--text);outline:none;resize:vertical}
.field textarea:focus,.field input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--chip);border-radius:9px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:5px 6px;font-size:12px;color:var(--dim);white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.stage button.on{color:color-mix(in srgb,var(--c) 70%,var(--text))}
.home-hint{font-size:11.5px;color:var(--dim);margin-top:6px}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:8px;border-radius:7px;padding:3px 4px}
.step:hover{background:var(--chip)}
.step input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent-fill);margin:0;flex:none;cursor:pointer}
.step input[type=text]{flex:1;border:0!important;background:transparent!important;box-shadow:none!important;padding:3px 0!important;border-radius:0!important}
.step.done input[type=text]{text-decoration:line-through;color:var(--faint)}
.step .x{border:0;background:none;color:var(--faint);opacity:0;font-size:14px;padding:0 4px}
.step:hover .x{opacity:1}
.tokens{display:flex;flex-wrap:wrap;gap:5px;align-items:center;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:5px 6px;min-height:36px}
.tokens:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.tok{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 7px;font-size:12px}
.tok button{border:0;background:none;color:var(--faint);padding:0 2px;font-size:13px}
.tokens input{flex:1;min-width:110px;border:0!important;background:transparent!important;box-shadow:none!important;padding:3px 2px!important;outline:none}
details.raw summary{cursor:pointer;font-size:10.5px;font-weight:650;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);list-style:none}
details.raw summary::before{content:"▸ ";}
details.raw[open] summary::before{content:"▾ ";}
details.raw textarea{margin-top:6px}
.d-foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.d-foot .grow{flex:1}

/* ---------- Select bar, popovers, toast ---------- */
.selbar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);z-index:40;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--ghost);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.selbar.on{transform:translate(-50%,0)}
.selbar .n{font-weight:650;margin-right:6px;white-space:nowrap}
.pop{position:fixed;z-index:45;top:58px;right:20px;width:340px;max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--ghost);padding:14px 16px;display:none}
.pop.on{display:block;animation:pop .18s ease-out}
.pop h4{margin:0 0 10px;font-size:13px}
.pop .grp{font-size:10.5px;font-weight:650;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
.pop .line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:12.5px}
.pop .path{font:11px ui-monospace,monospace;color:var(--dim);word-break:break-all}
.removed-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.removed-item:last-child{border-bottom:0}
.removed-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.removed-item .btn{height:26px;padding:0 9px;font-size:12px}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-160%);z-index:60;background:var(--text);color:var(--bg);border-radius:10px;padding:9px 14px;
  font-weight:550;box-shadow:var(--ghost);transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility .25s;display:flex;gap:12px;align-items:center;visibility:hidden}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast button{border:0;background:none;color:var(--accent);font-weight:700;padding:0}
.banner{margin:0 20px 10px;padding:8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px}
/* ---------- Work edition + Claude tools ---------- */
body.ed-work{--accent:#14b8a6;--accent-ink:#0f766e;--accent-fill:#0f766e;--accent-soft:#e2f7f3}
@media (prefers-color-scheme: dark){body.ed-work{--accent-ink:#5eead4;--accent-soft:#0e2926}}
body.ed-work .logo{background:linear-gradient(145deg,#99f6e4,#14b8a6 55%,#0f766e);box-shadow:0 4px 14px rgba(20,184,166,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.ed-pill{font-size:9.5px;font-weight:750;letter-spacing:.8px;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent-ink);margin-left:7px;vertical-align:2px}
.chip.sim{background:transparent;border:1px dashed color-mix(in srgb,var(--accent) 60%,transparent);color:var(--accent-ink);cursor:pointer}
.chip.nx{background:var(--accent-fill);color:#fff;font-weight:600}
.ask-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ask-chips button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:4px 10px;font-size:12px;color:var(--dim);transition:border-color .15s,color .15s}
.ask-chips button:hover{border-color:var(--accent);color:var(--accent-ink)}
.ask-chips button:disabled,.ask-in button:disabled{opacity:.5;cursor:default}
.ask-in{display:flex;gap:8px}
.ask-in input{flex:1}
.qa{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--input)}
.qa .q{font-weight:600;font-size:12.5px;display:flex;gap:6px;align-items:baseline}
.qa .q .x{margin-left:auto;border:0;background:none;color:var(--faint);padding:0 2px;font-size:13px}
.qa .a{margin-top:6px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.qa .a.bad{color:#dc2626}
.qa ol{margin:8px 0 0;padding-left:20px;font-size:12.5px;line-height:1.5;color:var(--dim)}
.qa .use{margin-top:8px;height:28px;font-size:12px}
.pick-row{display:flex;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer}
.pick-row:hover{background:var(--chip)}
.pick-row .rank{width:22px;height:22px;border-radius:50%;background:var(--accent-fill);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.pick-row .t{font-weight:600;line-height:1.35}
.pick-row .w{color:var(--dim);font-size:12px;margin-top:2px;line-height:1.45}
.note{margin-top:10px;padding:8px 10px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;line-height:1.45}
.bit{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:70;animation:bit 1.1s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes bit{60%{opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">💡</div>
    <div>
      <h1 id="brandName">Idea Forge</h1>
      <div class="stats" id="stats"></div>
    </div>
  </div>
  <div class="tools">
    <label class="search"><input id="q" type="text" placeholder="Search ideas" aria-label="Search ideas"><kbd>/</kbd></label>
    <select class="pill" id="fType" aria-label="Filter by type"></select>
    <select class="pill" id="fHome" aria-label="Filter by home"></select>
    <select class="pill" id="fApp" aria-label="Filter by app"></select>
    <button class="btn" id="nextBtn" hidden title="Claude looks at the whole board and picks what to build next">🎯 What next?</button>
    <button class="btn" id="selBtn" title="Tick cards to remove or move them together">☑︎ Select</button>
    <button class="btn" id="copyBtn" title="Copy everything pending as a Markdown checklist">📋 Checklist</button>
    <button class="btn icon" id="binBtn" title="Removed ideas" aria-label="Removed ideas">🗑</button>
    <button class="btn icon" id="setBtn" title="Settings" aria-label="Settings">⚙️</button>
  </div>
</header>

<div class="banner" id="demoBanner" hidden>Demo board — sample ideas, nothing is saved.</div>

<div class="capture">
  <div class="capture-in">
    <textarea id="thought" rows="1" placeholder="Dump a thought — messy is fine. Several ideas at once? Claude splits them into cards."></textarea>
    <div class="opts">
      <label class="sw" id="shapeSw" title="Claude turns the thought into a clear card"><input type="checkbox" id="autoShape"><b></b>✨ Shape</label>
      <button class="btn primary" id="addBtn">Add <span class="hint" style="color:inherit;opacity:.75">⏎</span></button>
    </div>
  </div>
</div>

<main class="board" id="board"></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Idea details"></aside>

<div class="selbar" id="selbar">
  <span class="n" id="selN">0 selected</span>
  <button class="btn" data-bulk="shipped">🚀 Shipped</button>
  <button class="btn" data-bulk="building">🔨 Building</button>
  <button class="btn" data-bulk="parked">🧊 Park</button>
  <button class="btn danger" data-bulk="removed">🗑 Remove</button>
  <button class="btn" id="selAll" title="Tick every visible card">All</button>
  <button class="btn" id="selDone">Done</button>
</div>

<div class="pop" id="setPop"></div>
<div class="pop" id="binPop"></div>
<div class="pop" id="nextPop"></div>
<div class="toast" id="toast"></div>

<script>
const STAGES = [
  {k:'inbox',    icon:'💭', name:'Inbox',    hint:'Raw thoughts, not shaped yet'},
  {k:'shaped',   icon:'📐', name:'Shaped',   hint:'Clear and ready to pick up'},
  {k:'building', icon:'🔨', name:'Building', hint:'Being built right now'},
  {k:'shipped',  icon:'🚀', name:'Shipped',  hint:'Done and released'},
  {k:'parked',   icon:'🧊', name:'Parked',   hint:'Not now — maybe later'},
];
const TYPES = {agent:{icon:'🤖',name:'New agent'}, enhancement:{icon:'✨',name:'Enhancement'}, fix:{icon:'🐞',name:'Fix'}, chore:{icon:'🧹',name:'Chore'}};
const HOMES = {
  personal:{icon:'🏠',name:'Personal',hint:'Ships to your public GitHub — anyone can use it and help build it.'},
  work:{icon:'💼',name:'Work',hint:'Ships to your work git — work data and code stay inside work.'},
  local:{icon:'🔒',name:'Local',hint:'Stays on this Mac — never pushed anywhere.'},
};
const PRIO = {high:{icon:'🔥',name:'High'}, med:{icon:'⚡',name:'Medium'}, low:{icon:'🌱',name:'Low'}};
const AV = ['#8b5cf6','#3b82f6','#10b981','#f59e0b','#ef4444','#0ea5e9','#ec4899','#14b8a6'];

const PERSONAL = {name:'Idea Forge', symbol:'💡', flavor:'personal', claudeTools:false, repo:'https://github.com/Sravankumartangudu/idea-forge', repoLabel:'GitHub',
  models:[['haiku', 'Haiku · fast'], ['sonnet', 'Sonnet'], ['opus', 'Opus · best']], appearances:[['system', 'System'], ['light', 'Light'], ['dark', 'Dark']]};
const S = {doc:{version:1,ideas:[]}, apps:[], people:[], claude:false, demo:false, settings:{}, file:'', version:'', ed:PERSONAL,
           q:'', fType:'all', fHome:'all', fApp:'', selecting:false, picked:new Set(), open:null, shaping:new Set(), asking:new Set(), nexting:false, deferred:null};
const tools = () => S.ed.claudeTools && S.claude;

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post = m => { try { webkit.messageHandlers.forge.postMessage(m) } catch (e) { console.log('post', m.cmd) } };
const now = () => new Date().toISOString();
const ideas = () => S.doc.ideas;
const byId = id => ideas().find(i => i.id === id);
const stageOf = k => STAGES.find(s => s.k === k);
const clip = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s;
const nameOf = i => (i.title || '').trim() || clip((i.raw || '').trim().split('\n')[0], 90) || 'Untitled idea';
const isPending = i => ['inbox','shaped','building'].includes(i.status);
const initials = n => n.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const avColor = n => AV[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % AV.length];
const fmtDate = s => s ? new Date(s).toLocaleDateString(undefined, {day:'numeric', month:'short'}) : '';
const appHome = name => (S.apps.find(a => a.name.toLowerCase() === (name || '').toLowerCase()) || {}).home || '';

// ---------- Persistence ----------
let saveTimer = null;
function save(soon) {
  clearTimeout(saveTimer);
  saveTimer = null;
  const go = () => { saveTimer = null; post({cmd:'save', doc:S.doc}); };
  if (soon) saveTimer = setTimeout(go, 350); else go();
}
function touch(i) { i.updated = now(); }
function newIdea(fields) {
  const n = Math.max(0, ...ideas().map(i => i.n || 0)) + 1;
  const col = ideas().filter(i => i.status === (fields.status || 'inbox'));
  const order = col.length ? Math.min(...col.map(i => i.order ?? 0)) - 1 : 0;
  const t = now();
  return Object.assign({id:'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), n, title:'', raw:'', summary:'', why:'',
    type:'', home:'', app:'', status:'inbox', priority:'med', steps:[], helpers:[], tags:[], order, created:t, updated:t}, fields);
}

// ---------- Bridge (called by the app) ----------
window.forge = {
  load(state) {
    if (drag && drag.started) { S.deferred = state; return; }
    // A typing save still waiting to go out is newer than the app's copy — keep it.
    if (!saveTimer) S.doc = state.doc && Array.isArray(state.doc.ideas) ? state.doc : {version:1, ideas:[]};
    S.apps = state.apps || []; S.people = state.people || []; S.claude = !!state.claude; S.demo = !!state.demo;
    S.settings = state.settings || {}; S.file = state.file || ''; S.version = state.version || '';
    S.ed = Object.assign({}, PERSONAL, state.edition || {});
    applyEdition();
    for (const i of ideas()) {
      i.steps = i.steps || []; i.helpers = i.helpers || []; i.tags = i.tags || []; i.status = i.status || 'inbox';
      // An answer that was on its way when the app quit never arrives.
      for (const c of i.chat || []) if (c.pending && !S.asking.has(i.id)) { delete c.pending; c.err = 'Interrupted — ask again.'; }
    }
    $('#demoBanner').hidden = !S.demo;
    renderAll();
  },
  shaped(id, cards, err) {
    S.shaping.delete(id);
    const i = byId(id);
    if (!i) return;
    if (err || !cards || !cards.length) { i.shapeError = err || 'Claude returned nothing.'; render(); return; }
    delete i.shapeError;
    applyCard(i, cards[0]);
    if (i.status === 'inbox') i.status = 'shaped';
    let after = i.order ?? 0;
    for (const c of cards.slice(1)) {
      const extra = newIdea({raw:i.raw, status:i.status});
      applyCard(extra, c);
      extra.order = after += 0.001;
      ideas().push(extra);
      flashIds.add(extra.id);
    }
    flashIds.add(i.id);
    save(); renderAll();
    toast(cards.length > 1 ? `✨ Shaped into ${cards.length} cards` : '✨ Shaped: ' + nameOf(i));
  },
  answered(id, res, err) {
    S.asking.delete(id);
    const i = byId(id);
    if (!i) return;
    const q = (i.chat || [])[0];
    if (q && q.pending) {
      delete q.pending;
      if (err || !res) q.err = err || 'Claude returned nothing.';
      else { q.a = res.answer || ''; q.steps = (res.steps || []).filter(Boolean); }
      q.at = now();
      save();
    }
    if (S.open === id) renderDrawer();
  },
  whatNext() { whatNext(); },
  nextPicks(res, err) {
    S.nexting = false;
    if (err || !res) S.nextErr = err || 'Claude returned nothing.';
    else { delete S.nextErr; S.doc.next = {at:now(), picks:(res.picks || []).filter(p => ideas().some(i => i.n === p.n && isPending(i))), note:res.note || ''}; save(); }
    render();
    if (!$('#nextPop').classList.contains('on')) togglePop('nextPop'); else renderNext();
  },
  built(ok) { toast(ok ? '🚀 Opened Claude Code in Terminal' : '⚠︎ Couldn\'t open Terminal'); },
  focusCapture() { closeDrawer(); setTimeout(() => $('#thought').focus(), 60); },
  capture(text) { addThought(text); },
  openCard(id) { if (byId(id)) openDrawer(id); },
};

function applyCard(i, c) {
  const app = S.apps.find(a => a.name.toLowerCase() === (c.app || '').toLowerCase());
  const done = new Set(i.steps.filter(s => s.done).map(s => s.t.toLowerCase()));
  Object.assign(i, {
    title: c.title || i.title, summary: c.summary || '', why: c.why || '',
    type: c.type || i.type, app: app ? app.name : (c.app || ''),
    home: c.home || (app && app.home) || i.home || '',
    priority: c.priority || i.priority || 'med',
    steps: (c.steps || []).map(t => ({t, done: done.has(t.toLowerCase())})),
    helpers: [...new Set([...(i.helpers || []), ...(c.helpers || [])])],
    tags: (c.tags || []).slice(0, 3), shapedAt: now(),
    similar: (c.similar || []).filter(n => n !== i.n && ideas().some(x => x.n === n && x.status !== 'removed')),
  });
  touch(i);
}

function shape(i, single) {
  if (!S.claude) { toast('Claude CLI not found — install Claude Code to shape ideas'); return; }
  delete i.shapeError;
  S.shaping.add(i.id);
  let text = i.raw || i.title;
  if (single && (i.title || i.summary)) text += `\n\n(Current card — title: ${i.title}; notes: ${i.summary})`;
  post({cmd:'shape', id:i.id, text, single});
  render();
}

function applyEdition() {
  const e = S.ed;
  document.body.classList.toggle('ed-work', e.flavor === 'work');
  document.title = e.name;
  $('.logo').textContent = e.symbol;
  const base = e.name.replace(/ Work$/, '');
  $('#brandName').innerHTML = esc(base) + (base !== e.name ? '<span class="ed-pill">WORK</span>' : '');
  $('#nextBtn').hidden = !e.claudeTools;
  $('#nextBtn').disabled = !S.claude;
}

// ---------- Claude tools (work edition) ----------
function boardText() {
  const lines = [];
  for (const k of ['building', 'shaped', 'inbox']) for (const i of ideas().filter(x => x.status === k).sort((a, b) => (a.order ?? 0) - (b.order ?? 0))) {
    const st = i.steps || [];
    lines.push(`#${i.n} [${k}] ${nameOf(i)}` + [TYPES[i.type] && TYPES[i.type].name, i.app && 'for ' + i.app, PRIO[i.priority] && PRIO[i.priority].name + ' priority',
      st.length && `${st.filter(s => s.done).length}/${st.length} steps done`, 'added ' + fmtDate(i.created), i.updated && 'touched ' + fmtDate(i.updated)].filter(Boolean).map(x => ' · ' + x).join('')
      + (i.summary ? `\n   ${i.summary}` : ''));
  }
  return lines.join('\n');
}
function whatNext() {
  if (!S.ed.claudeTools) return;
  if (!S.claude) { toast('Claude CLI not found — install Claude Code first'); return; }
  if (!ideas().some(isPending)) { toast('Nothing pending to pick from'); return; }
  if (!S.nexting) { S.nexting = true; delete S.nextErr; post({cmd:'next', board:boardText()}); }
  $$('.pop').forEach(p => p.id !== 'nextPop' && p.classList.remove('on'));
  $('#nextPop').classList.add('on'); renderNext();
}
function renderNext() {
  const nx = S.doc.next, picks = (nx && nx.picks || []).map(p => ({p, i:ideas().find(x => x.n === p.n)})).filter(x => x.i && isPending(x.i));
  $('#nextPop').innerHTML = `<h4>🎯 What to build next</h4>` +
    (S.nexting ? `<div class="shimmer" style="color:var(--accent-ink)">Claude is reading your board</div>` : '') +
    (S.nextErr ? `<div class="err">⚠︎ ${esc(S.nextErr)}</div>` : '') +
    (!S.nexting && picks.length ? picks.map(({p, i}, k) => `<div class="pick-row" data-open="${esc(i.id)}"><span class="rank">${k + 1}</span>
        <div><div class="t"><span class="ref">#${i.n}</span> ${esc(nameOf(i))}</div><div class="w">${esc(p.why)}</div></div></div>`).join('')
      + (nx.note ? `<div class="note">${esc(nx.note)}</div>` : '')
      + `<div class="hint" style="margin-top:10px">Picked ${fmtDate(nx.at)} · <a href="#" data-renext style="color:var(--accent-ink)">Ask again</a></div>` : '') +
    (!S.nexting && !picks.length && !S.nextErr ? '<div class="hint">No picks yet.</div>' : '');
}
const ASKS = [['🧭', 'Make a build plan', 'Make a step-by-step build plan for this.'], ['⚠️', 'What could go wrong?', 'What could go wrong or be hard about this, and how do I avoid it?'],
              ['✂️', 'Smallest version', 'What is the smallest useful first version I could ship quickly?'], ['🤝', 'Who could help?', 'What kind of people or teams could help with this, and what should I ask them?']];
function ask(i, q) {
  q = (q || '').trim();
  if (!q || S.asking.has(i.id)) return;
  if (!S.claude) { toast('Claude CLI not found — install Claude Code first'); return; }
  i.chat = [{q, pending:true, at:now()}, ...(i.chat || []).filter(c => !c.pending)].slice(0, 8);
  S.asking.add(i.id);
  post({cmd:'ask', id:i.id, brief:brief(i), q});
  save(); renderDrawer();
}
function askHTML(i) {
  const busy = S.asking.has(i.id), dis = busy || !S.claude ? 'disabled' : '';
  return `<div class="field"><span class="lbl">💬 Ask Claude</span>
    <div class="ask-chips">${ASKS.map(([ic, l, q], k) => `<button type="button" data-ask="${k}" ${dis} title="${esc(q)}">${ic} ${l}</button>`).join('')}</div>
    <div class="ask-in"><input type="text" id="askQ" placeholder="${S.claude ? 'Ask anything about this idea' : 'Claude CLI not found'}" ${S.claude ? '' : 'disabled'}><button class="btn primary" data-act="ask" ${dis}>Ask</button></div>
    ${(i.chat || []).map((c, k) => `<div class="qa"><div class="q">💬 ${esc(c.q)}${c.pending ? '' : `<button class="x" data-chatdel="${k}" title="Forget this answer" aria-label="Forget">✕</button>`}</div>
      ${c.pending ? `<div class="shimmer" style="color:var(--accent-ink)">Claude is thinking</div>` : (c.err ? `<div class="a bad">⚠︎ ${esc(c.err)}</div>` : `<div class="a">${esc(c.a)}</div>`)}
      ${c.steps && c.steps.length ? `<ol>${c.steps.map(t => `<li>${esc(t)}</li>`).join('')}</ol><button class="btn use" data-usesteps="${k}">Use as build steps</button>` : ''}</div>`).join('')}
  </div>`;
}

// ---------- Capture ----------
function addThought(text) {
  text = (text || '').trim();
  if (!text) return;
  const first = text.split('\n')[0];
  const i = newIdea({raw:text, title: first.length <= 80 ? first : ''});
  ideas().push(i);
  flashIds.add(i.id);
  save();
  if (S.settings.autoShape !== false && S.claude) shape(i, false); else render();
  toast('💭 Added to Inbox');
}

// ---------- Rendering ----------
const flashIds = new Set();
function matches(i) {
  if (S.fType !== 'all' && (i.type || 'none') !== S.fType) return false;
  if (S.fHome !== 'all' && (i.home || 'none') !== S.fHome) return false;
  if (S.fApp && (i.app || '') !== S.fApp) return false;
  if (S.q) {
    const hay = [i.title, i.summary, i.raw, i.why, i.app, ...(i.tags || []), ...(i.helpers || []), '#' + i.n].join(' ').toLowerCase();
    if (!S.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function cardHTML(i) {
  const t = TYPES[i.type], h = HOMES[i.home], p = PRIO[i.priority];
  const steps = i.steps || [], done = steps.filter(s => s.done).length;
  const cls = ['card', i.type ? 't-' + i.type : '', S.picked.has(i.id) ? 'picked' : '', S.shaping.has(i.id) ? 'shaping' : '', flashIds.has(i.id) ? 'flash' : ''].join(' ');
  const helpers = (i.helpers || []).slice(0, 4).map(n => `<span class="av" style="background:${avColor(n)}" title="${esc(n)} can help">${esc(initials(n))}</span>`).join('');
  return `<article class="${cls}" data-id="${esc(i.id)}" tabindex="0" aria-label="${esc(nameOf(i))}">
    <div class="card-top">
      <span class="ref">#${i.n ?? '–'}</span>
      ${t ? `<span class="type">${t.icon} ${t.name}</span>` : `<span class="type" style="color:var(--faint)">Unshaped</span>`}
      ${p && i.priority !== 'med' ? `<span class="prio" title="${p.name} priority">${p.icon}</span>` : '<span class="prio"></span>'}
      <label class="pick" title="Select"><input type="checkbox" ${S.picked.has(i.id) ? 'checked' : ''} data-pick="${esc(i.id)}"></label>
    </div>
    <h3>${esc(nameOf(i))}</h3>
    ${i.summary ? `<p class="sum">${esc(i.summary)}</p>` : (!i.title && i.raw ? '' : (i.raw && i.raw.trim() !== i.title ? `<p class="sum">${esc(i.raw)}</p>` : ''))}
    <div class="meta">
      ${h ? `<span class="chip h-${i.home}" title="${esc(h.hint)}">${h.icon} ${h.name}</span>` : (i.type ? `<span class="chip h-none" title="Where it ships isn't decided">🤔 Home?</span>` : '')}
      ${i.app ? `<span class="chip" title="Enhancement for ${esc(i.app)}">${esc(i.app)}</span>` : ''}
      ${nextRank(i) ? `<span class="chip nx" title="Claude's pick to build next">🎯 Next</span>` : ''}
      ${(i.similar || []).slice(0, 1).map(n => `<span class="chip sim" data-goto="${n}" title="Claude thinks this overlaps with #${n}">🔁 Like #${n}</span>`).join('')}
      ${(i.tags || []).slice(0, 2).map(g => `<span class="chip">${esc(g)}</span>`).join('')}
      ${helpers ? `<span class="helpers">${helpers}</span>` : ''}
    </div>
    ${steps.length ? `<div class="progress"><div class="bar"><b style="width:${Math.round(done / steps.length * 100)}%"></b></div><span>${done}/${steps.length}</span></div>` : ''}
    ${i.status === 'shipped' && i.shippedAt ? `<div class="when">🚀 Shipped ${fmtDate(i.shippedAt)}</div>` : ''}
    ${S.shaping.has(i.id) ? `<div class="shimmer">✨ Shaping with Claude</div>` : ''}
    ${i.shapeError ? `<div class="err">⚠︎ <span>${esc(i.shapeError.slice(0, 140))}</span> <button data-retry="${esc(i.id)}">Retry</button></div>` : ''}
  </article>`;
}

function nextRank(i) {
  if (!S.ed.claudeTools || !isPending(i) || !S.doc.next) return 0;
  return (S.doc.next.picks || []).findIndex(p => p.n === i.n) + 1;
}

function render() {
  const board = $('#board');
  const scroll = Object.fromEntries($$('.list', board).map(l => [l.dataset.stage, l.scrollTop]));
  const left = board.scrollLeft;
  board.classList.toggle('selecting', S.selecting);
  board.innerHTML = STAGES.map(s => {
    const list = ideas().filter(i => i.status === s.k).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    const shown = list.filter(matches);
    const hidden = list.length - shown.length;
    return `<section class="col" data-stage="${s.k}" style="--c:var(--${s.k})">
      <div class="col-h"><span class="dot"></span><h2>${s.icon} ${s.name}</h2><span class="count" title="${list.length} in ${s.name}">${list.length}</span></div>
      <div class="col-sub">${s.hint}${hidden ? ` · ${hidden} hidden by filters` : ''}</div>
      <div class="list" data-stage="${s.k}">
        ${shown.map(cardHTML).join('') || `<div class="empty">${list.length ? 'No matches' : (s.k === 'inbox' ? 'Your forge is cold 🔥<br>Drop a thought above' : 'Drag a card here')}</div>`}
      </div>
    </section>`;
  }).join('');
  $$('.list', board).forEach(l => { l.scrollTop = scroll[l.dataset.stage] || 0; });
  board.scrollLeft = left;
  setTimeout(() => flashIds.clear(), 50);
  renderStats();
  renderSelbar();
  if (S.open && !$('#drawer').contains(document.activeElement)) renderDrawer();
}

function renderStats() {
  const c = k => ideas().filter(i => i.status === k).length;
  const pending = ideas().filter(isPending).length;
  $('#stats').innerHTML = [
    `<span class="stat"><b>${pending}</b>&nbsp;pending</span>`,
    ...STAGES.filter(s => c(s.k)).map(s => `<span class="stat"><i style="background:var(--${s.k})"></i>${c(s.k)} ${s.name.toLowerCase()}</span>`),
  ].join('');
  $('#binBtn').title = `Removed ideas (${c('removed')})`;
}

function renderFilters() {
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label)}</option>`;
  $('#fType').innerHTML = opt('all', 'All types', S.fType) + Object.entries(TYPES).map(([k, t]) => opt(k, `${t.icon} ${t.name}`, S.fType)).join('') + opt('none', 'Unshaped', S.fType);
  $('#fHome').innerHTML = opt('all', 'Anywhere', S.fHome) + Object.entries(HOMES).map(([k, h]) => opt(k, `${h.icon} ${h.name}`, S.fHome)).join('') + opt('none', '🤔 Undecided', S.fHome);
  const used = [...new Set(ideas().filter(i => i.status !== 'removed').map(i => i.app).filter(Boolean))].sort();
  if (S.fApp && !used.includes(S.fApp)) used.push(S.fApp);
  $('#fApp').innerHTML = opt('', 'All apps', S.fApp) + used.map(a => opt(a, a, S.fApp)).join('');
  for (const [id, on] of [['fType', S.fType !== 'all'], ['fHome', S.fHome !== 'all'], ['fApp', !!S.fApp]]) $('#' + id).classList.toggle('on', on);
  const sw = $('#autoShape');
  sw.checked = S.claude && S.settings.autoShape !== false;
  sw.disabled = !S.claude;
  $('#shapeSw').title = S.claude ? 'Claude turns the thought into a clear card' : 'Claude CLI not found — install Claude Code to shape ideas';
}

function renderAll() { renderFilters(); render(); if ($('#setPop').classList.contains('on')) renderSettings(); if ($('#binPop').classList.contains('on')) renderBin(); if ($('#nextPop').classList.contains('on')) renderNext(); }

// ---------- Drawer ----------
function openDrawer(id) {
  S.open = id;
  renderDrawer();
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
  setTimeout(() => { const t = $('.d-title'); if (t && !byId(id).title) t.focus(); }, 200);
}
function closeDrawer() {
  S.open = null;
  $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on');
}

function segHTML(name, opts, cur, extra = '') {
  return `<div class="seg ${extra}" data-seg="${name}">` + opts.map(([v, label, style]) =>
    `<button type="button" data-v="${esc(v)}" class="${v === cur ? 'on' : ''}" ${style ? `style="${style}"` : ''}>${label}</button>`).join('') + '</div>';
}

function tokensHTML(field, list, ph) {
  return `<div class="tokens" data-tokens="${field}">${(list || []).map((t, k) =>
    `<span class="tok">${field === 'helpers' ? `<span class="av" style="background:${avColor(t)};width:16px;height:16px;font-size:8px;border:0">${esc(initials(t))}</span>` : ''}${esc(t)}<button data-tokdel="${k}" aria-label="Remove">✕</button></span>`).join('')}
    <input type="text" data-tokin="${field}" placeholder="${ph}"${field === 'helpers' && S.people.length ? ' list="peopleList"' : ''}>
    ${field === 'helpers' && S.people.length ? `<datalist id="peopleList">${S.people.map(p => `<option value="${esc(p)}">`).join('')}</datalist>` : ''}</div>`;
}

function setStatus(i, status) {
  if (i.status === status) return;
  if (status === 'removed') i.prevStatus = i.status;
  if (status === 'shipped') i.shippedAt = now();
  if (status === 'removed') i.removedAt = now();
  i.status = status;
  const col = ideas().filter(x => x.status === status && x !== i);
  i.order = status === 'shipped' || status === 'inbox' ? (col.length ? Math.min(...col.map(x => x.order ?? 0)) - 1 : 0)
                                                       : (col.length ? Math.max(...col.map(x => x.order ?? 0)) + 1 : 0);
  touch(i);
}

function brief(i) {
  const t = TYPES[i.type], h = HOMES[i.home], p = PRIO[i.priority];
  const lines = [`### ${t ? t.icon + ' ' : ''}${nameOf(i)}`, ''];
  if (i.summary) lines.push(i.summary, '');
  if (i.why) lines.push(`**Why:** ${i.why}`, '');
  const meta = [t && t.name, i.app && `for ${i.app}`, h && `${h.icon} ${h.name}`, p && `${p.icon} ${p.name} priority`, stageOf(i.status)?.name].filter(Boolean);
  lines.push(`_${meta.join(' · ')}_`, '');
  if ((i.steps || []).length) { lines.push('**Steps**'); i.steps.forEach(s => lines.push(`- [${s.done ? 'x' : ' '}] ${s.t}`)); lines.push(''); }
  if ((i.helpers || []).length) lines.push(`**Who can help:** ${i.helpers.join(', ')}`);
  return lines.join('\n').trim();
}

function checklist() {
  const order = ['building', 'shaped', 'inbox', 'parked'];
  const out = [`## ${S.ed.symbol} ${S.ed.name} — ${ideas().filter(isPending).length} pending`];
  for (const k of order) {
    const s = stageOf(k);
    const list = ideas().filter(i => i.status === k).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    if (!list.length) continue;
    out.push('', `### ${s.icon} ${s.name} (${list.length})`);
    for (const i of list) {
      const tags = [TYPES[i.type] && `${TYPES[i.type].icon} ${TYPES[i.type].name}`, i.app, HOMES[i.home] && `${HOMES[i.home].icon} ${HOMES[i.home].name}`, PRIO[i.priority]?.icon].filter(Boolean);
      out.push(`- [ ] #${i.n} **${nameOf(i)}**${i.summary ? ' — ' + i.summary : ''} _(${tags.join(' · ') || 'unshaped'})_`);
    }
  }
  return out.join('\n');
}

// ---------- Drag and drop (pointer-based, so it feels the same everywhere) ----------
let drag = null;
const board = $('#board');

board.addEventListener('pointerdown', e => {
  const card = e.target.closest('.card');
  if (!card || e.button !== 0 || e.target.closest('button,input,label,a,textarea,[data-goto]')) return;
  drag = {card, id:card.dataset.id, sx:e.clientX, sy:e.clientY, started:false};
});

window.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
    startDrag();
  }
  moveDrag();
});

window.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag;
  if (!d.started) {
    drag = null;
    if (S.selecting) togglePick(d.id); else openDrawer(d.id);
    return;
  }
  endDrag();
});

function startDrag() {
  const r = drag.card.getBoundingClientRect();
  drag.started = true;
  drag.dx = drag.sx - r.left; drag.dy = drag.sy - r.top;
  drag.from = drag.card.closest('.list').dataset.stage;
  const g = drag.card.cloneNode(true);
  g.classList.add('ghost'); g.classList.remove('flash');
  g.style.width = r.width + 'px';
  document.body.appendChild(g);
  drag.ghost = g;
  const ph = document.createElement('div');
  ph.className = 'placeholder'; ph.style.height = r.height + 'px';
  drag.card.before(ph);
  drag.card.style.display = 'none';
  drag.ph = ph;
  document.body.classList.add('dragging');
  drag.raf = requestAnimationFrame(autoScroll);
}

function moveDrag() {
  const {ghost, ph} = drag;
  ghost.style.left = (drag.x - drag.dx) + 'px';
  ghost.style.top = (drag.y - drag.dy) + 'px';
  const el = document.elementFromPoint(drag.x, drag.y);
  const col = el && el.closest('.col');
  $$('.col.over').forEach(c => c !== col && c.classList.remove('over'));
  if (!col) return;
  col.classList.add('over');
  const list = $('.list', col);
  const cards = $$('.card', list).filter(c => c !== drag.card);
  const before = cards.find(c => { const r = c.getBoundingClientRect(); return drag.y < r.top + r.height / 2; });
  $('.empty', list)?.remove();
  ph.style.setProperty('--c', `var(--${list.dataset.stage})`);
  if (before) { if (ph.nextSibling !== before) list.insertBefore(ph, before); }
  else if (list.lastElementChild !== ph) list.appendChild(ph);
}

function autoScroll() {
  if (!drag || !drag.started) return;
  const b = board.getBoundingClientRect(), edge = 60;
  if (drag.x < b.left + edge) board.scrollLeft -= 14; else if (drag.x > b.right - edge) board.scrollLeft += 14;
  const list = drag.ph.parentElement;
  if (list) {
    const r = list.getBoundingClientRect();
    if (drag.y < r.top + 40) list.scrollTop -= 10; else if (drag.y > r.bottom - 40) list.scrollTop += 10;
  }
  drag.raf = requestAnimationFrame(autoScroll);
}

function endDrag() {
  const d = drag; drag = null;
  cancelAnimationFrame(d.raf);
  document.body.classList.remove('dragging');
  $$('.col.over').forEach(c => c.classList.remove('over'));
  const list = d.ph.parentElement;
  const to = list.dataset.stage;
  const i = byId(d.id);
  // New order = the visible order of the target column with the card at the placeholder.
  const ids = [...list.children].filter(el => el !== d.card).map(el => el === d.ph ? d.id : el.dataset && el.dataset.id).filter(Boolean);
  const gr = d.ph.getBoundingClientRect();
  d.ghost.style.transition = 'left .16s ease-out, top .16s ease-out, transform .16s ease-out';
  d.ghost.style.left = gr.left + 'px'; d.ghost.style.top = gr.top + 'px'; d.ghost.style.transform = 'none';
  setTimeout(() => {
    d.ghost.remove();
    if (i) {
      if (i.status !== to) setStatus(i, to);
      // Hidden (filtered) cards keep their place after the visible ones.
      const hidden = ideas().filter(x => x.status === to && !ids.includes(x.id)).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      [...ids.map(byId).filter(Boolean), ...hidden].forEach((x, k) => { x.order = k; });
      touch(i);
      save();
      if (to === 'shipped' && d.from !== 'shipped') confetti(gr.left + gr.width / 2, gr.top + 20);
    }
    if (S.deferred) { const s = S.deferred; S.deferred = null; forge.load(s); } else render();
  }, 170);
}

function confetti(x, y) {
  const colors = ['#f59e0b', '#8b5cf6', '#10b981', '#3b82f6', '#ef4444', '#ec4899'];
  for (let k = 0; k < 42; k++) {
    const b = document.createElement('i');
    b.className = 'bit';
    const a = Math.random() * Math.PI * 2, r = 60 + Math.random() * 130;
    b.style.cssText = `left:${x}px;top:${y}px;background:${colors[k % colors.length]};--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r + 90}px;--r:${Math.random() * 720 - 360}deg`;
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1200);
  }
  toast('🚀 Shipped — nice work!');
}

// ---------- Select mode ----------
function togglePick(id) { S.picked.has(id) ? S.picked.delete(id) : S.picked.add(id); render(); }
function renderSelbar() {
  $('#selBtn').classList.toggle('on', S.selecting);
  $('#selbar').classList.toggle('on', S.selecting);
  $('#selN').textContent = `${S.picked.size} selected`;
  $$('#selbar [data-bulk]').forEach(b => b.disabled = !S.picked.size);
}
function bulk(status) {
  const list = [...S.picked].map(byId).filter(Boolean);
  if (!list.length) return;
  const before = list.map(i => ({i, status:i.status, order:i.order}));
  list.forEach(i => setStatus(i, status));
  S.picked.clear();
  save(); render();
  const label = status === 'removed' ? 'Removed' : 'Moved to ' + stageOf(status).name;
  toast(`${label}: ${list.length} idea${list.length > 1 ? 's' : ''}`, () => {
    before.forEach(({i, status, order}) => { i.status = status; i.order = order; delete i.removedAt; });
    save(); render();
  });
}

// ---------- Popovers ----------
function renderSettings() {
  const st = S.settings;
  // "Citadel's choice — Sonnet" is too long for a segment: show "Citadel · Sonnet", full label on hover.
  const short = l => l.replace(/^(\S+)'s choice — /, '$1 · ').replace(/^Default — /, 'Default · ');
  const segBtns = (key, opts, cur) => `<div class="seg" data-setting="${key}">` + opts.map(([v, l]) => `<button type="button" data-v="${v}" title="${esc(l)}" class="${v === cur ? 'on' : ''}">${esc(short(l))}</button>`).join('') + '</div>';
  const sw = (key, label, on, dis) => `<label class="line"><span>${label}</span><span class="sw"><input type="checkbox" data-toggle="${key}" ${on ? 'checked' : ''} ${dis ? 'disabled' : ''}><b></b></span></label>`;
  $('#setPop').innerHTML = `<h4>⚙️ Settings</h4>
    <div class="grp">Appearance</div>${segBtns('appearance', S.ed.appearances, st.appearance || S.ed.appearances[0][0])}
    <div class="grp">Shaping with Claude</div>
    ${S.claude ? '' : '<div class="hint" style="margin-bottom:6px">Claude CLI not found. Install Claude Code to shape ideas; cards still work without it.</div>'}
    ${sw('autoShape', 'Shape new thoughts automatically', S.claude && st.autoShape !== false, !S.claude)}
    <div class="line"><span>Model</span></div>${segBtns('model', S.ed.models, st.model || S.ed.models[0][0])}
    ${S.ed.claudeTools ? '<div class="hint" style="margin-top:6px">Used for shaping, 💬 Ask Claude and 🎯 What next.</div>' : ''}
    <div class="grp">Menu bar</div>
    ${sw('showCount', 'Show pending count next to ' + S.ed.symbol, st.showCount !== false)}
    ${sw('login', 'Launch at login', !!st.login)}
    <div class="grp">Your ideas file</div>
    <div class="path">${esc(S.file)}</div>
    <div class="hint" style="margin:4px 0 8px">Only on this Mac. Edits made to it elsewhere show up here live.</div>
    <button class="btn" data-reveal>Show in Finder</button>
    <div class="grp">About</div>
    <div class="hint">${esc(S.ed.name)} ${esc(S.version)} · <a href="${esc(S.ed.repo)}" style="color:var(--accent-ink)">${esc(S.ed.repoLabel)}</a></div>`;
}

function renderBin() {
  const gone = ideas().filter(i => i.status === 'removed').sort((a, b) => (b.removedAt || '').localeCompare(a.removedAt || ''));
  $('#binPop').innerHTML = `<h4>🗑 Removed (${gone.length})</h4>` + (gone.length ? gone.map(i => `<div class="removed-item">
      <span class="ref">#${i.n}</span><span class="t" title="${esc(nameOf(i))}">${esc(nameOf(i))}</span>
      <button class="btn" data-restore="${esc(i.id)}">Restore</button><button class="btn danger" data-purge="${esc(i.id)}" title="Delete forever">✕</button></div>`).join('')
    + `<div style="margin-top:10px"><button class="btn danger" data-purgeall>Empty bin</button></div>`
    : '<div class="hint">Nothing removed. Removed ideas wait here so you can bring them back.</div>');
}

function togglePop(id) {
  const p = $('#' + id), on = !p.classList.contains('on');
  $$('.pop').forEach(x => x.classList.remove('on'));
  if (on) { id === 'setPop' ? renderSettings() : id === 'binPop' ? renderBin() : renderNext(); p.classList.add('on'); }
}

// ---------- Toast ----------
let toastTimer;
function toast(text, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(text)}</span>` + (undo ? '<button>Undo</button>' : '');
  if (undo) $('button', t).onclick = () => { undo(); t.classList.remove('on'); };
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), undo ? 6000 : 2400);
}

// ---------- Events ----------
function autosize(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 220) + 'px'; }

const thought = $('#thought');
thought.addEventListener('input', () => autosize(thought));
thought.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); addThought(thought.value); thought.value = ''; autosize(thought); }
});
$('#addBtn').onclick = () => { addThought(thought.value); thought.value = ''; autosize(thought); thought.focus(); };
$('#autoShape').onchange = e => { S.settings.autoShape = e.target.checked; post({cmd:'setting', key:'autoShape', value:e.target.checked}); };

$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); render(); });
$('#fType').onchange = e => { S.fType = e.target.value; renderAll(); };
$('#fHome').onchange = e => { S.fHome = e.target.value; renderAll(); };
$('#fApp').onchange = e => { S.fApp = e.target.value; renderAll(); };
$('#selBtn').onclick = () => { S.selecting = !S.selecting; if (!S.selecting) S.picked.clear(); render(); };
$('#selDone').onclick = () => { S.selecting = false; S.picked.clear(); render(); };
$('#selAll').onclick = () => { $$('#board .card').forEach(c => S.picked.add(c.dataset.id)); render(); };
$$('#selbar [data-bulk]').forEach(b => b.onclick = () => bulk(b.dataset.bulk));
$('#copyBtn').onclick = () => { post({cmd:'copy', text:checklist()}); toast(`📋 Copied ${ideas().filter(isPending).length} pending as a checklist`); };
$('#setBtn').onclick = e => { e.stopPropagation(); togglePop('setPop'); };
$('#binBtn').onclick = e => { e.stopPropagation(); togglePop('binPop'); };
$('#nextBtn').onclick = e => { e.stopPropagation(); $('#nextPop').classList.contains('on') ? togglePop('nextPop') : (S.doc.next && !S.nextErr ? togglePop('nextPop') : whatNext()); };
$('#nextPop').addEventListener('click', e => {
  const r = e.target.closest('[data-open]'); if (r) { $('#nextPop').classList.remove('on'); openDrawer(r.dataset.open); }
  if (e.target.closest('[data-renext]')) { e.preventDefault(); whatNext(); }
});
function gotoIdea(n) { const x = ideas().find(i => i.n === n); if (x) { if (x.status === 'removed') toast(`#${n} is in the bin`); else openDrawer(x.id); } }
$('#scrim').onclick = closeDrawer;

board.addEventListener('change', e => { if (e.target.dataset.pick) togglePick(e.target.dataset.pick); });
board.addEventListener('click', e => {
  const r = e.target.closest('[data-retry]');
  if (r) { const i = byId(r.dataset.retry); if (i) shape(i, !!i.shapedAt); }
  const g = e.target.closest('[data-goto]');
  if (g) gotoIdea(+g.dataset.goto);
});
board.addEventListener('keydown', e => {
  const c = e.target.closest('.card');
  if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); S.selecting ? togglePick(c.dataset.id) : openDrawer(c.dataset.id); }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.pop') && !e.target.closest('#setBtn,#binBtn,#nextBtn')) $$('.pop').forEach(p => p.classList.remove('on'));
});

// Settings + bin popovers
$('#setPop').addEventListener('click', e => {
  const b = e.target.closest('[data-setting] button');
  if (b) { const key = b.parentElement.dataset.setting; S.settings[key] = b.dataset.v; post({cmd:'setting', key, value:b.dataset.v}); renderSettings(); }
  if (e.target.closest('[data-reveal]')) post({cmd:'reveal'});
  const a = e.target.closest('a'); if (a) { e.preventDefault(); post({cmd:'open', url:a.href}); }
});
$('#setPop').addEventListener('change', e => {
  const k = e.target.dataset.toggle; if (!k) return;
  S.settings[k] = e.target.checked; post({cmd:'setting', key:k, value:e.target.checked});
  if (k === 'autoShape') renderFilters();
});
$('#binPop').addEventListener('click', e => {
  const r = e.target.closest('[data-restore]'), p = e.target.closest('[data-purge]');
  if (r) { const i = byId(r.dataset.restore); if (i) { setStatus(i, i.prevStatus && i.prevStatus !== 'removed' ? i.prevStatus : 'inbox'); delete i.removedAt; flashIds.add(i.id); save(); render(); renderBin(); toast('↩︎ Restored: ' + nameOf(i)); } }
  if (p) { S.doc.ideas = ideas().filter(i => i.id !== p.dataset.purge); save(); render(); renderBin(); }
  if (e.target.closest('[data-purgeall]') && confirm('Delete every removed idea forever?')) { S.doc.ideas = ideas().filter(i => i.status !== 'removed'); save(); render(); renderBin(); }
});

// Drawer editing
const drawer = $('#drawer');
drawer.addEventListener('input', e => {
  const i = byId(S.open); if (!i) return;
  const t = e.target;
  if (t.dataset.f) {
    i[t.dataset.f] = t.value; touch(i);
    if (t.dataset.f === 'app' && !i.home && appHome(t.value)) { i.home = appHome(t.value); renderDrawer(); $('#dApp').focus(); }
    if (t.classList.contains('d-title')) autosize(t);
    save(true); render();
  } else if (t.dataset.steptext !== undefined) {
    i.steps[+t.dataset.steptext].t = t.value; touch(i); save(true); render();
  }
});
drawer.addEventListener('change', e => {
  const i = byId(S.open); if (!i) return;
  const t = e.target;
  if (t.dataset.step !== undefined) { i.steps[+t.dataset.step].done = t.checked; touch(i); save(); render(); renderDrawer(); }
  if (t.dataset.f === 'app') renderFilters();
});
drawer.addEventListener('keydown', e => {
  const i = byId(S.open); if (!i) return;
  const t = e.target;
  if (e.key === 'Enter' && t.id === 'newStep' && t.value.trim()) {
    i.steps.push({t:t.value.trim(), done:false}); touch(i); save(); render(); renderDrawer(); $('#newStep').focus();
  }
  if (e.key === 'Enter' && t.dataset.tokin && t.value.trim()) {
    const f = t.dataset.tokin, v = t.value.trim().replace(/,$/, '');
    if (!i[f].some(x => x.toLowerCase() === v.toLowerCase())) i[f].push(v);
    touch(i); save(); render(); renderDrawer(); $(`[data-tokin="${f}"]`).focus();
  }
  if (e.key === 'Backspace' && t.dataset.tokin && !t.value && i[t.dataset.tokin].length) {
    const f = t.dataset.tokin; i[f].pop(); touch(i); save(); render(); renderDrawer(); $(`[data-tokin="${f}"]`).focus();
  }
  if (e.key === 'Enter' && t.classList.contains('d-title')) { e.preventDefault(); t.blur(); }
  if (e.key === 'Enter' && t.id === 'askQ' && !e.isComposing) { e.preventDefault(); ask(i, t.value); }
});
drawer.addEventListener('click', e => {
  const i = byId(S.open); if (!i) return;
  const segBtn = e.target.closest('[data-seg] button');
  if (segBtn) {
    const f = segBtn.parentElement.dataset.seg, v = segBtn.dataset.v;
    if (f === 'status') { const was = i.status; setStatus(i, v); if (v === 'shipped' && was !== 'shipped') { const r = segBtn.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top); } }
    else { i[f] = i[f] === v && f !== 'priority' ? '' : v; touch(i); }
    save(); render(); renderDrawer(); return;
  }
  const sd = e.target.closest('[data-stepdel]');
  if (sd) { i.steps.splice(+sd.dataset.stepdel, 1); touch(i); save(); render(); renderDrawer(); return; }
  const td = e.target.closest('[data-tokdel]');
  if (td) { const f = td.closest('[data-tokens]').dataset.tokens; i[f].splice(+td.dataset.tokdel, 1); touch(i); save(); render(); renderDrawer(); return; }
  const ab = e.target.closest('[data-ask]');
  if (ab) { ask(i, ASKS[+ab.dataset.ask][2]); return; }
  const cd = e.target.closest('[data-chatdel]');
  if (cd) { i.chat.splice(+cd.dataset.chatdel, 1); save(); renderDrawer(); return; }
  const us = e.target.closest('[data-usesteps]');
  if (us) {
    const c = i.chat[+us.dataset.usesteps], old = i.steps;
    i.steps = c.steps.map(t => ({t, done:false})); touch(i); save(); render(); renderDrawer();
    toast(`🧭 ${c.steps.length} build steps set`, () => { i.steps = old; save(); render(); renderDrawer(); });
    return;
  }
  const go = e.target.closest('[data-goto]');
  if (go) { gotoIdea(+go.dataset.goto); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'close') closeDrawer();
  if (act === 'ask') ask(i, $('#askQ').value);
  if (act === 'build') {
    post({cmd:'build', brief:brief(i), app:i.app || '', n:i.n});
    if (i.status === 'inbox' || i.status === 'shaped') { setStatus(i, 'building'); save(); render(); renderDrawer(); }
  }
  if (act === 'reshape') { shape(i, true); renderDrawer(); }
  if (act === 'brief') { post({cmd:'copy', text:brief(i)}); toast('📋 Brief copied — paste it to whoever can help'); }
  if (act === 'remove') {
    const prev = i.status, order = i.order;
    setStatus(i, 'removed'); save(); closeDrawer(); render();
    toast('🗑 Removed: ' + nameOf(i), () => { i.status = prev; i.order = order; delete i.removedAt; save(); render(); });
  }
});

document.addEventListener('keydown', e => {
  const typing = e.target.closest('input,textarea');
  if (e.key === 'Escape') {
    if ($$('.pop.on').length) $$('.pop').forEach(p => p.classList.remove('on'));
    else if (S.open) closeDrawer();
    else if (S.selecting) { S.selecting = false; S.picked.clear(); render(); }
    else if (typing) e.target.blur();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'n') { e.preventDefault(); forge.focusCapture(); }
});

// Opened in a plain browser (no app around it): show the demo board so the page can be previewed.
if (!window.webkit?.messageHandlers?.forge) {
  fetch('demo.json').then(r => r.json()).then(doc => forge.load({doc, demo:true, apps:[], claude:false, settings:{}})).catch(() => forge.load({doc:{ideas:[]}}));
} else {
  post({cmd:'ready'});
}
</script>
</body>
</html>
