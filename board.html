<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Idea Forge</title>
<style>
:root{
  --bg:#f4f5f9; --panel:#ffffff; --col:#eaecf3; --line:#dfe2ea; --line2:#cfd3de;
  --text:#161922; --dim:#535a6d; --faint:#7d8496;
  --accent:#f59e0b; --accent-ink:#9a5800; --accent-fill:#b45309; --accent-soft:#fff3db;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 2px 8px rgba(20,24,40,.05);
  --shadow-up:0 6px 18px rgba(20,24,40,.10),0 2px 6px rgba(20,24,40,.06);
  --ghost:0 22px 50px rgba(20,24,40,.25),0 6px 14px rgba(20,24,40,.12);
  --inbox:#64748b; --shaped:#8b5cf6; --building:#f59e0b; --shipped:#10b981; --parked:#0ea5e9;
  --t-agent:#8b5cf6; --t-enhancement:#3b82f6; --t-fix:#ef4444; --t-chore:#64748b; --t-none:#c3c8d4;
  --chip:#f1f3f8; --input:#f7f8fb; --overlay:rgba(16,18,28,.28);
  --radius:12px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  font-size:13px; color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0f15; --panel:#171a23; --col:#12151d; --line:#262a36; --line2:#323746;
    --text:#e9ecf3; --dim:#a3a9b9; --faint:#7a8195;
    --accent-ink:#fbbf24; --accent-soft:#2b2110;
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-up:0 8px 22px rgba(0,0,0,.45);
    --ghost:0 24px 60px rgba(0,0,0,.6);
    --t-none:#3d4252; --chip:#1f232e; --input:#11141b; --overlay:rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;padding-top:26px}
/* The top 26px sit under the window's title bar: the app lays a drag strip over them. */
input,textarea,[contenteditable]{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}

/* ---------- Header ---------- */
.top{display:flex;align-items:center;gap:14px;padding:12px 20px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(145deg,#fde68a,#f59e0b 55%,#d97706);box-shadow:0 4px 14px rgba(245,158,11,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px}
.stats{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.stat{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
.stat i{width:7px;height:7px;border-radius:50%;display:inline-block}
.stat+.stat::before{content:"·";margin-right:1px;color:var(--faint)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{position:relative}
.search input{width:220px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
  padding:0 30px 0 30px;font:inherit;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.search::before{content:"⌕";position:absolute;left:10px;top:6px;font-size:15px;color:var(--faint)}
.search kbd{position:absolute;right:8px;top:8px;font:10px ui-monospace,monospace;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px}
select.pill{height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;padding:0 26px 0 10px;
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 13px) 14px,calc(100% - 9px) 14px;background-size:4px 4px;background-repeat:no-repeat;outline:none}
select.pill.on{border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);padding:0 12px;display:inline-flex;align-items:center;gap:6px;
  font-weight:500;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--chip)}
.btn:active{transform:translateY(1px)}
.btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent-fill)}
.btn.icon{width:32px;padding:0;justify-content:center;font-size:15px}
.btn.danger{color:#dc2626}
@media (prefers-color-scheme: dark){.btn.danger{color:#f87171}}

/* ---------- Capture ---------- */
.capture{margin:2px 20px 12px;border-radius:14px;padding:1.5px;
  background:linear-gradient(110deg,color-mix(in srgb,var(--accent) 70%,transparent),color-mix(in srgb,var(--shaped) 60%,transparent) 55%,color-mix(in srgb,var(--t-enhancement) 50%,transparent))}
.capture-in{background:var(--panel);border-radius:12.5px;display:flex;align-items:flex-end;gap:12px;padding:10px 10px 10px 14px}
.capture textarea{flex:1;border:0;outline:none;resize:none;background:transparent;color:var(--text);font-family:inherit;font-size:14px;line-height:1.45;
  min-height:22px;max-height:160px;padding:4px 0}
.capture textarea::placeholder{color:var(--faint)}
.capture .opts{display:flex;align-items:center;gap:10px}
.hint{font-size:11px;color:var(--faint)}

/* ---------- Switch ---------- */
.sw{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:var(--dim);white-space:nowrap}
.sw input{display:none}
.sw b{width:30px;height:18px;border-radius:9px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.sw b::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked+b{background:var(--accent-fill)}
.sw input:checked+b::after{transform:translateX(12px)}
.sw input:disabled+b{opacity:.45}

/* ---------- Board ---------- */
.board{flex:1;display:flex;gap:14px;padding:0 20px 18px;overflow-x:auto;overflow-y:hidden;min-height:0}
.col{flex:1 0 236px;max-width:380px;display:flex;flex-direction:column;background:var(--col);border-radius:14px;min-height:0;
  border:1px solid transparent;transition:border-color .15s,background .15s}
.col.over{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 7%,var(--col))}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.col-h .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.col-h h2{margin:0;font-size:13px;font-weight:650}
.col-h .count{margin-left:auto;min-width:22px;height:20px;border-radius:10px;padding:0 7px;display:grid;place-items:center;font-size:11px;font-weight:650;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--text))}
.col-sub{font-size:11px;color:var(--faint);padding:0 14px 8px;margin-top:-4px}
.list{flex:1;overflow-y:auto;padding:4px 10px 14px;display:flex;flex-direction:column;gap:9px;min-height:60px}
.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px;border:2px solid var(--col)}
.empty{border:1.5px dashed var(--line2);border-radius:var(--radius);padding:18px 10px;text-align:center;color:var(--faint);font-size:12px}
.placeholder{border:2px dashed color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:var(--radius);flex:none}

/* ---------- Card ---------- */
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px 10px 15px;box-shadow:var(--shadow);
  cursor:grab;transition:box-shadow .15s,transform .15s,border-color .15s;flex:none;animation:pop .25s ease-out}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3.5px;border-radius:0 3px 3px 0;background:var(--tc,var(--t-none))}
.card:hover{box-shadow:var(--shadow-up);transform:translateY(-1px);border-color:var(--line2)}
.card.flash{animation:flash 1.2s ease-out}
.card.picked{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent),var(--shadow)}
.card.t-agent{--tc:var(--t-agent)}.card.t-enhancement{--tc:var(--t-enhancement)}.card.t-fix{--tc:var(--t-fix)}.card.t-chore{--tc:var(--t-chore)}
.card-top{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-bottom:5px}
.ref{font:600 10.5px ui-monospace,SFMono-Regular,monospace;color:var(--faint)}
.type{font-weight:600;color:color-mix(in srgb,var(--tc,var(--faint)) 70%,var(--text))}
.prio{margin-left:auto;font-size:12px}
.pick{display:none;margin-left:6px}
.selecting .pick{display:inline-flex}
.pick input{width:15px;height:15px;accent-color:var(--accent-fill);margin:0;cursor:pointer}
.card h3{margin:0;font-size:13.5px;font-weight:620;line-height:1.35;letter-spacing:-.1px;word-break:break-word}
.card .sum{margin:4px 0 0;color:var(--dim);font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:9px}
.chip{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--dim);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.h-personal{background:color-mix(in srgb,var(--shipped) 14%,transparent);color:color-mix(in srgb,var(--shipped) 60%,var(--text))}
.chip.h-work{background:color-mix(in srgb,var(--t-enhancement) 14%,transparent);color:color-mix(in srgb,var(--t-enhancement) 60%,var(--text))}
.chip.h-local{background:color-mix(in srgb,var(--t-chore) 16%,transparent)}
.chip.h-none{border:1px dashed var(--line2);background:transparent;color:var(--faint)}
.helpers{display:flex;margin-left:auto}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;border:2px solid var(--panel);margin-left:-6px}
.av:first-child{margin-left:0}
.progress{display:flex;align-items:center;gap:8px;margin-top:9px}
.progress .bar{flex:1;height:4px;border-radius:2px;background:var(--chip);overflow:hidden}
.progress .bar b{display:block;height:100%;border-radius:2px;background:var(--tc,var(--accent));transition:width .3s}
.progress span{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.when{font-size:10.5px;color:var(--faint);margin-top:7px}
.card.shaping{cursor:progress}
.card.shaping h3,.card.shaping .sum{opacity:.55}
.shimmer{margin-top:8px;font-size:11.5px;font-weight:600;color:var(--shaped);display:flex;align-items:center;gap:7px}
.shimmer::after{content:"";flex:1;height:5px;border-radius:3px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--shaped) 45%,transparent),transparent);
  background-size:200% 100%;animation:shim 1.2s linear infinite}
.shimmer .live{min-width:0;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pipe{margin-top:7px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 5px;font-size:10.5px;color:var(--faint)}
.pipe .on{color:color-mix(in srgb,var(--shipped) 65%,var(--text));font-weight:600}
.pipe i{font-style:normal;opacity:.6}
.d-body .pipe{font-size:12px;margin:4px 0 2px}
.auto-sum{margin:2px 0 0;font-size:12.5px;line-height:1.45}
.err{margin-top:8px;font-size:11.5px;color:#dc2626;display:flex;gap:6px;align-items:baseline}
.err button{border:0;background:none;color:var(--accent-ink);font-weight:600;padding:0;text-decoration:underline}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(2.2deg) scale(1.03);box-shadow:var(--ghost);cursor:grabbing;animation:none;transition:none;opacity:.97}
body.dragging,body.dragging *{cursor:grabbing!important}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}}
@keyframes flash{0%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:var(--shadow)}}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,92vw);background:var(--panel);border-left:1px solid var(--line);z-index:31;
  transform:translateX(104%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.15)}
.drawer.on{transform:none}
.d-head{display:flex;align-items:center;gap:8px;padding:14px 18px 6px;font-size:11.5px;color:var(--faint)}
.d-head .btn{margin-left:auto}
.d-body{flex:1;overflow-y:auto;padding:4px 18px 18px}
.d-title{width:100%;border:0;outline:none;background:transparent;font-family:inherit;font-size:19px;font-weight:700;line-height:1.3;color:var(--text);padding:4px 0;resize:none}
.field{margin-top:14px}
.field>label,.field>.lbl{display:block;font-size:10.5px;font-weight:650;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.field textarea,.field input[type=text]{width:100%;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13px;line-height:1.45;color:var(--text);outline:none;resize:vertical}
.field textarea:focus,.field input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--chip);border-radius:9px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:5px 6px;font-size:12px;color:var(--dim);white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.stage button.on{color:color-mix(in srgb,var(--c) 70%,var(--text))}
.home-hint{font-size:11.5px;color:var(--dim);margin-top:6px}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:8px;border-radius:7px;padding:3px 4px}
.step:hover{background:var(--chip)}
.step input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent-fill);margin:0;flex:none;cursor:pointer}
.step input[type=text]{flex:1;border:0!important;background:transparent!important;box-shadow:none!important;padding:3px 0!important;border-radius:0!important}
.step.done input[type=text]{text-decoration:line-through;color:var(--faint)}
.step .x{border:0;background:none;color:var(--faint);opacity:0;font-size:14px;padding:0 4px}
.step:hover .x{opacity:1}
.tokens{display:flex;flex-wrap:wrap;gap:5px;align-items:center;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:5px 6px;min-height:36px}
.tokens:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.tok{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 7px;font-size:12px}
.tok button{border:0;background:none;color:var(--faint);padding:0 2px;font-size:13px}
.tokens input{flex:1;min-width:110px;border:0!important;background:transparent!important;box-shadow:none!important;padding:3px 2px!important;outline:none}
details.raw summary{cursor:pointer;font-size:10.5px;font-weight:650;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);list-style:none}
details.raw summary::before{content:"▸ ";}
details.raw[open] summary::before{content:"▾ ";}
details.raw textarea{margin-top:6px}
.d-foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.d-foot .grow{flex:1}

/* ---------- Select bar, popovers, toast ---------- */
.selbar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);z-index:40;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--ghost);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.selbar.on{transform:translate(-50%,0)}
.selbar .n{font-weight:650;margin-right:6px;white-space:nowrap}
.pop{position:fixed;z-index:45;top:58px;right:20px;width:340px;max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--ghost);padding:14px 16px;display:none}
.pop.on{display:block;animation:pop .18s ease-out}
.pop h4{margin:0 0 10px;font-size:13px}
.pop .grp{font-size:10.5px;font-weight:650;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
.pop .line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:12.5px}
.pop .path{font:11px ui-monospace,monospace;color:var(--dim);word-break:break-all}
.removed-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.removed-item:last-child{border-bottom:0}
.removed-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.removed-item .btn{height:26px;padding:0 9px;font-size:12px}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-160%);z-index:60;background:var(--text);color:var(--bg);border-radius:10px;padding:9px 14px;
  font-weight:550;box-shadow:var(--ghost);transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility .25s;display:flex;gap:12px;align-items:center;visibility:hidden}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast button{border:0;background:none;color:var(--accent);font-weight:700;padding:0}
.banner{margin:0 20px 10px;padding:8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px}
/* ---------- Work edition + Claude tools ---------- */
body.ed-work{--accent:#14b8a6;--accent-ink:#0f766e;--accent-fill:#0f766e;--accent-soft:#e2f7f3}
@media (prefers-color-scheme: dark){body.ed-work{--accent-ink:#5eead4;--accent-soft:#0e2926}}
body.ed-work .logo{background:linear-gradient(145deg,#99f6e4,#14b8a6 55%,#0f766e);box-shadow:0 4px 14px rgba(20,184,166,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.ed-pill{font-size:9.5px;font-weight:750;letter-spacing:.8px;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent-ink);margin-left:7px;vertical-align:2px}
.chip.sim{background:transparent;border:1px dashed color-mix(in srgb,var(--accent) 60%,transparent);color:var(--accent-ink);cursor:pointer}
.chip.nx{background:var(--accent-fill);color:#fff;font-weight:600}
.ask-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ask-chips button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:4px 10px;font-size:12px;color:var(--dim);transition:border-color .15s,color .15s}
.ask-chips button:hover{border-color:var(--accent);color:var(--accent-ink)}
.ask-chips button:disabled,.ask-in button:disabled{opacity:.5;cursor:default}
.ask-in{display:flex;gap:8px}
.ask-in input{flex:1}
.qa{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--input)}
.qa .q{font-weight:600;font-size:12.5px;display:flex;gap:6px;align-items:baseline}
.qa .q .x{margin-left:auto;border:0;background:none;color:var(--faint);padding:0 2px;font-size:13px}
.qa .a{margin-top:6px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.qa .a.bad{color:#dc2626}
.qa ol{margin:8px 0 0;padding-left:20px;font-size:12.5px;line-height:1.5;color:var(--dim)}
.qa .use{margin-top:8px;height:28px;font-size:12px}
.pick-row{display:flex;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer}
.pick-row:hover{background:var(--chip)}
.pick-row .rank{width:22px;height:22px;border-radius:50%;background:var(--accent-fill);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.pick-row .t{font-weight:600;line-height:1.35}
.pick-row .w{color:var(--dim);font-size:12px;margin-top:2px;line-height:1.45}
.note{margin-top:10px;padding:8px 10px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;line-height:1.45}
.bit{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:70;animation:bit 1.1s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes bit{60%{opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
/* ---------- 1.1: tabs, challenges, origins, tray, matrix, AI settings ---------- */
:root{--ch-open:#f97316;--ch-ideas:#8b5cf6;--ch-solved:#10b981;--o-ai:#8b5cf6;--o-page:#3b82f6;--o-teammate:#10b981}
.tabbar{display:flex;align-items:center;gap:8px;padding:0 20px 10px;flex-wrap:wrap}
.tabbar .grow{flex:1}
/* Stages | Groups is a layout switch, not a tab: set it apart with space and a divider. */
.tabbar #viewSeg{position:relative;margin-left:25px}
.tabbar #viewSeg::before{content:'';position:absolute;left:-17px;top:5px;bottom:5px;width:1px;background:var(--line)}
.tabs{flex:none}
.tabs button{flex:none;padding:6px 14px;font-size:12.5px}
.tabs .n{font-size:10.5px;color:var(--faint);margin-left:5px;font-variant-numeric:tabular-nums}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--accent-fill);color:#fff;font-size:10.5px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px}
.btn.busy{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.btn:disabled{opacity:.5;cursor:default}
.chip.o-ai{background:color-mix(in srgb,var(--o-ai) 14%,transparent);color:color-mix(in srgb,var(--o-ai) 65%,var(--text))}
.chip.o-page{background:color-mix(in srgb,var(--o-page) 14%,transparent);color:color-mix(in srgb,var(--o-page) 65%,var(--text))}
.chip.o-teammate{background:color-mix(in srgb,var(--o-teammate) 14%,transparent);color:color-mix(in srgb,var(--o-teammate) 60%,var(--text))}
.chip.o-you{background:var(--chip)}
.chip.chl{cursor:pointer;border:1px solid color-mix(in srgb,var(--ch-open) 40%,transparent);background:transparent;color:color-mix(in srgb,var(--ch-open) 70%,var(--text))}
.card.ch{--tc:var(--t-none)}
.card.ch.i-high{--tc:#ef4444}.card.ch.i-med{--tc:#f59e0b}.card.ch.i-low{--tc:#94a3b8}
.card.ch{cursor:pointer}
.hits{margin-left:auto;font:650 11px ui-monospace,SFMono-Regular,monospace;color:var(--dim)}
.ch-act{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.mini{height:24px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-size:11.5px;padding:0 8px;color:var(--dim)}
.mini:hover{border-color:var(--accent);color:var(--accent-ink)}
.mini:disabled{opacity:.5;cursor:default}
.board.mx{display:grid;grid-template-columns:minmax(220px,.75fr) 1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);overflow:hidden}
.board.mx .col{max-width:none;min-width:0}
.board.mx .unplaced{grid-row:1 / span 2}
.board.mx .card .sum{-webkit-line-clamp:1}
.why-q{font-size:11px;color:var(--faint);margin-top:6px;font-style:italic}
.pop.wide{width:430px}
#setPop{width:390px}
.sug{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;background:var(--panel)}
.sug .t{font-weight:600;line-height:1.35;cursor:pointer}
.sug .t:hover{color:var(--accent-ink)}
.sug .w{color:var(--dim);font-size:12px;margin-top:2px;line-height:1.45}
.sug-top{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--faint);margin-bottom:5px;flex-wrap:wrap}
.sug-act{display:flex;gap:6px;margin-top:8px}
.sug-act .btn,.pop .btn.sm{height:28px;padding:0 10px;font-size:12px}
.linked{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}
.linked:hover{background:var(--chip)}
.linked .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linked .btn{height:24px;padding:0 8px;font-size:11.5px}
.ai-status{padding:7px 10px;border-radius:8px;font-size:12px;margin:6px 0;line-height:1.4}
.ai-status.ok{background:color-mix(in srgb,var(--shipped) 13%,transparent);color:color-mix(in srgb,var(--shipped) 60%,var(--text))}
.ai-status.bad{background:var(--accent-soft);color:var(--accent-ink)}
.inrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.inrow .lbl2{font-size:11.5px;color:var(--dim);width:46px;flex:none}
.fin{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--input);padding:0 9px;font:inherit;color:var(--text);outline:none;min-width:0;flex:1}
.fin:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.pop select.pill{height:30px;flex:1;min-width:0;width:100%}
.pop .tokens{min-height:32px}
.good{color:color-mix(in srgb,var(--shipped) 65%,var(--text))}
.bad{color:#dc2626}
.field select.pill{width:100%}
.inline-in{display:flex;gap:8px;margin-top:6px;align-items:center}
.inline-in input{flex:1}
.src{font-size:11.5px;color:var(--dim);margin-top:6px}
.src a{color:var(--accent-ink)}
.banner.click{cursor:pointer}
.chip.stg{background:color-mix(in srgb,var(--c) 15%,transparent);color:color-mix(in srgb,var(--c) 65%,var(--text))}
.chip.grp-chip{cursor:pointer}
.chip.grp-chip:hover{color:var(--accent-ink)}
.col.add-grp{flex:0 0 190px;background:transparent;border:1px dashed var(--line);padding:14px;align-items:stretch}
.tabbar .seg[hidden],.tools [hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* fleet-styles:map
   page: body
   bar: .top
   card: .card, .col, .pop, .drawer, .qa
   title: .brand h1, .pop h4
   nav: .seg
   tab: .seg button
   pick: .seg button.on
   btn: .btn:not(.primary)
   primary: .btn.primary
   field: .field textarea, .field input[type=text], .search input, select.pill, .fin
   chip: .chip
   vars: --bg=bg --panel=card --col=panel --line=line --line2=line --text=text --dim=text2 --faint=muted --accent=accent --accent-ink=accent --accent-fill=accent-bg --accent-soft=soft --chip=soft --input=field --shadow=shadow --shadow-up=shadow
*/
:root[data-style]:not([data-style=standard]) body.ed-work { --accent: var(--st-accent); --accent-ink: var(--st-accent); --accent-fill: var(--st-accent-bg); --accent-soft: var(--st-soft); }
:root[data-style]:not([data-style=standard]) .logo { background: var(--st-accent-bg); box-shadow: none; }
/* fleet-styles:begin css */
/* Fleet styles kit v1: the 14 design styles every app offers (Settings › Style, and the parent's
   🎨 Style per app). The copy in Nexus/styles is pasted by Nexus's scripts/sync-styles.sh
   between the fleet-styles:begin / fleet-styles:end markers at the END of each page's <style>, so it wins over the page.
   The pick sits on <html data-style> (FleetStyles.wear in Swift puts it there). "standard" has no layer: it's the
   page's own look.
   Pages differ, so the rules below name roles, not classes: .card, .col, .pop, .drawer, .qa, .fx-card .top .btn:not(.primary), .fx-btn … The sync script swaps each for the
   selectors the page lists in its  fleet-styles:map  comment (and the fx- settings kit's own classes); a role the page
   doesn't list matches nothing. The map's  vars:  line points the page's own colour variables at the style's --st-*
   ones, so everything the page draws with them follows the style too.
   Every colour is light-dark(light, dark): Appearance (System / Light / Dark) still decides which. */
:root[data-style]:not([data-style=standard]) { color-scheme: light dark;
  --fx-bg: var(--st-bg); --fx-side: var(--st-panel); --fx-card: var(--st-card); --fx-field: var(--st-field); --fx-raised: var(--st-card);
  --fx-text: var(--st-text); --fx-muted: var(--st-muted); --fx-line: var(--st-line); --fx-accent: var(--st-accent);
  --fx-accent-soft: var(--st-soft); --fx-accent-fill: var(--st-accent-bg); --fx-accent-ink: var(--st-accent); --fx-on-accent: var(--st-on-accent);
  --fx-shadow: var(--st-shadow); }
/* Styles with a wallpaper: it sits on the page, the page's own background lets it through. */
:is([data-style=skeuo], [data-style=glass], [data-style=liquid], [data-style=aurora], [data-style=cyber]) :is(body) { background: transparent; }

/* Skeuomorphic: real things — linen behind, stitched paper cards, a brushed-metal bar, glossy buttons, embossed type. */
:root[data-style=skeuo] { --st-bg: light-dark(#d8d2c4, #241f19); --st-card: light-dark(#fffdf5, #362e25); --st-panel: light-dark(#ece6d6, #2d261f);
  --st-line: light-dark(#d9cfb8, #4d4234); --st-text: light-dark(#2b2418, #f1e8d8); --st-text2: light-dark(#4a3f2c, #d6cab5); --st-muted: light-dark(#6b5d45, #a8997f);
  --st-accent: light-dark(#2f62c9, #8fb2ff); --st-soft: light-dark(rgba(47,98,201,.1), rgba(143,178,255,.14)); --st-accent-bg: #3d6fd6;
  --st-accent-bg-hov: light-dark(#2f62c9, #4a7be0); --st-on-accent: #fff; --st-head: light-dark(#ece6d6, #2d261f); --st-field: light-dark(#f8f4e8, #2a241d);
  --st-shadow: 0 2px 5px rgba(0,0,0,.22);
  --sk-tex: light-dark(rgba(90,70,40,.06), rgba(0,0,0,.2)); --sk-stitch: light-dark(rgba(120,95,60,.38), rgba(230,200,150,.3));
  --sk-hi: light-dark(rgba(255,255,255,.8), rgba(255,255,255,.09)); --sk-metal: linear-gradient(light-dark(#f6f6f6, #4c4c4c), light-dark(#cdcdcd, #2b2b2b));
  --sk-btn: linear-gradient(light-dark(#fff, #5b5246), light-dark(#e1ddd3, #3d362d)); --sk-btn-line: light-dark(#a89f8c, #1e1a15);
  --sk-emboss: 0 1px 0 light-dark(rgba(255,255,255,.85), rgba(0,0,0,.6)); --sk-gloss: light-dark(rgba(255,255,255,.6), rgba(255,255,255,.12));
  background: repeating-linear-gradient(45deg, var(--sk-tex) 0 1px, transparent 1px 3px), repeating-linear-gradient(-45deg, var(--sk-tex) 0 1px, transparent 1px 3px), var(--st-bg); background-attachment: fixed; }
[data-style=skeuo] :is(body) { font-family: "Lucida Grande", "Helvetica Neue", sans-serif; }
[data-style=skeuo] :is(.top) { background: var(--sk-metal); border-bottom: 1px solid var(--sk-btn-line); -webkit-backdrop-filter: none; backdrop-filter: none;
  box-shadow: inset 0 1px 0 var(--sk-hi), 0 2px 6px rgba(0,0,0,.25); }
[data-style=skeuo] :is(.fx-nav) { background: var(--st-panel); box-shadow: inset -1px 0 0 var(--sk-btn-line), inset -2px 0 0 var(--sk-hi); border-right: 0; }
[data-style=skeuo] :is(.brand h1, .pop h4, .fx-title, .st-none) { text-shadow: var(--sk-emboss); }
[data-style=skeuo] :is(.card, .col, .pop, .drawer, .qa, .fx-card) { border-radius: 6px; outline: 1px dashed var(--sk-stitch); outline-offset: -5px;
  box-shadow: inset 0 1px 0 var(--sk-hi), 0 2px 5px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.04); }
[data-style=skeuo] :is(.st-none) { box-shadow: inset 0 1px 0 var(--sk-hi), 0 1px 3px rgba(0,0,0,.22); }
[data-style=skeuo] :is(.btn:not(.primary), .fx-btn, .seg, .fx-seg) { background: var(--sk-btn); border: 1px solid var(--sk-btn-line); color: var(--st-text); box-shadow: inset 0 1px 0 var(--sk-hi), 0 1px 2px rgba(0,0,0,.2); }
[data-style=skeuo] :is(.btn:not(.primary), .fx-btn) { text-shadow: var(--sk-emboss); } [data-style=skeuo] :is(.btn:not(.primary), .fx-btn):hover { filter: brightness(1.04); }
[data-style=skeuo] :is(.btn:not(.primary), .fx-btn):active { filter: brightness(.92); box-shadow: inset 0 1px 3px rgba(0,0,0,.35); }
[data-style=skeuo] :is(.btn.primary, .fx-btn.fx-primary, #st-n) { background: linear-gradient(#6f9be8, #2f62c9); border-color: #2551a8; color: #fff; text-shadow: 0 -1px 0 rgba(0,0,0,.35);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 1px 2px rgba(0,0,0,.25); }
[data-style=skeuo] :is(.seg button.on, .fx-seg button.on, .fx-seg label:has(input:checked), .fx-nav button.on, #st-n) { background: linear-gradient(#6593e6, #2c5cc2); color: #fff; text-shadow: 0 -1px 0 rgba(0,0,0,.4); border-radius: 6px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.2); }
[data-style=skeuo] :is(.chip) { background-image: linear-gradient(var(--sk-gloss), transparent 65%); border-color: rgba(0,0,0,.14); box-shadow: 0 1px 1px rgba(0,0,0,.12); }
[data-style=skeuo] :is(.field textarea, .field input[type=text], .search input, select.pill, .fin, .fx-field, .fx-card input[type=text], .fx-card input[type=number], .fx-card input[type=time], .fx-card select, .fx-card textarea) { background: var(--st-field); border: 1px solid var(--sk-btn-line); box-shadow: inset 0 1px 3px rgba(0,0,0,.22); }

/* Flat: no depth at all — solid colours, no shadows or gradients, small corners. */
:root[data-style=flat] { --st-bg: light-dark(#ecf0f1, #1e272e); --st-card: light-dark(#fff, #2c3a47); --st-panel: light-dark(#e3e8ea, #34495e);
  --st-line: light-dark(#dde3e6, #3d5266); --st-text: light-dark(#2c3e50, #ecf0f1); --st-text2: light-dark(#34495e, #d5dde3); --st-muted: light-dark(#5d6d7e, #a5b4c2);
  --st-accent: light-dark(#2471a3, #5dade2); --st-soft: light-dark(rgba(41,128,185,.12), rgba(93,173,226,.16)); --st-accent-bg: #2980b9; --st-accent-bg-hov: #3498db;
  --st-on-accent: #fff; --st-head: light-dark(#fff, #2c3a47); --st-field: light-dark(#fff, #22303b); --st-shadow: none; }
[data-style=flat] :is(.card, .col, .pop, .drawer, .qa, .fx-card, .st-none) { border: 0; border-radius: 4px; box-shadow: none; }
[data-style=flat] :is(.top) { background: var(--st-head); border-bottom: 3px solid var(--st-accent-bg); box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
[data-style=flat] :is(.fx-nav) { background: var(--st-panel); border-right: 0; }
[data-style=flat] :is(.seg, .fx-seg) { border-radius: 4px; box-shadow: none; } [data-style=flat] :is(.seg button, .fx-seg button, .fx-seg label, .fx-nav button) { border-radius: 3px; }
[data-style=flat] :is(.seg button.on, .fx-seg button.on, .fx-seg label:has(input:checked), .fx-nav button.on, #st-n) { background: var(--st-accent-bg); color: #fff; box-shadow: none; }
[data-style=flat] :is(.btn:not(.primary), .fx-btn) { border: 0; border-radius: 4px; background: var(--st-panel); color: var(--st-text); box-shadow: none; }
[data-style=flat] :is(.btn.primary, .fx-btn.fx-primary, #st-n) { background: var(--st-accent-bg); color: #fff; } [data-style=flat] :is(.btn.primary, .fx-btn.fx-primary, #st-n):hover { background: var(--st-accent-bg-hov); }
[data-style=flat] :is(.chip) { border: 0; border-radius: 3px; box-shadow: none; }
[data-style=flat] :is(.field textarea, .field input[type=text], .search input, select.pill, .fin, .fx-field, .fx-card input[type=text], .fx-card input[type=number], .fx-card input[type=time], .fx-card select, .fx-card textarea) { border: 2px solid var(--st-line); border-radius: 4px; box-shadow: none; }
[data-style=flat] :is(.field textarea, .field input[type=text], .search input, select.pill, .fin, .fx-field, .fx-card input[type=text], .fx-card input[type=number], .fx-card input[type=time], .fx-card select, .fx-card textarea):focus { border-color: var(--st-accent); box-shadow: none; }

/* Material: paper layers with real shadows — raised app bar, underlined picked tab, uppercase buttons. */
:root[data-style=material] { --st-bg: light-dark(#fafafa, #121212); --st-card: light-dark(#fff, #1e1e1e); --st-panel: light-dark(#eee, #2c2c2c);
  --st-line: light-dark(#e0e0e0, #333); --st-text: light-dark(#212121, #e8e8e8); --st-text2: light-dark(#424242, #c8c8c8); --st-muted: light-dark(#616161, #9e9e9e);
  --st-accent: light-dark(#3f51b5, #8c9eff); --st-soft: light-dark(rgba(63,81,181,.1), rgba(140,158,255,.14)); --st-accent-bg: light-dark(#3f51b5, #5c6bc0);
  --st-accent-bg-hov: light-dark(#303f9f, #7986cb); --st-on-accent: #fff; --st-head: light-dark(#fff, #1e1e1e); --st-field: light-dark(#f2f2f2, #2c2c2c);
  --st-shadow: 0 1px 3px light-dark(rgba(0,0,0,.12), rgba(0,0,0,.5)), 0 1px 2px light-dark(rgba(0,0,0,.24), rgba(0,0,0,.6)); --md-pink: #ff4081; }
[data-style=material] :is(.card, .col, .pop, .drawer, .qa, .fx-card, .st-none) { border: 0; border-radius: 4px; box-shadow: var(--st-shadow); }
[data-style=material] :is(.top) { background: var(--st-head); border-bottom: 0; -webkit-backdrop-filter: none; backdrop-filter: none;
  box-shadow: 0 2px 4px rgba(0,0,0,.2), 0 4px 5px rgba(0,0,0,.14); }
[data-style=material] :is(.fx-nav) { border-right: 0; box-shadow: 1px 0 3px rgba(0,0,0,.18); }
[data-style=material] :is(.seg, .fx-seg) { border-radius: 4px; }
[data-style=material] :is(.seg button.on, .fx-seg button.on, .fx-seg label:has(input:checked), .fx-nav button.on, #st-n) { background: var(--st-soft); color: var(--st-accent); border-radius: 4px 4px 0 0; box-shadow: inset 0 -3px 0 var(--md-pink); }
[data-style=material] :is(.btn:not(.primary), .fx-btn) { border-radius: 4px; border: 1px solid var(--st-line); background: transparent; color: var(--st-accent); box-shadow: none;
  text-transform: uppercase; letter-spacing: .05em; font-weight: 600; font-size: 12px; }
[data-style=material] :is(.btn:not(.primary), .fx-btn):hover { background: var(--st-soft); }
[data-style=material] :is(.btn.primary, .fx-btn.fx-primary, #st-n) { background: var(--st-accent-bg); color: #fff; border-color: transparent;
  box-shadow: 0 3px 1px -2px rgba(0,0,0,.2), 0 2px 2px rgba(0,0,0,.14), 0 1px 5px rgba(0,0,0,.12); }
[data-style=material] :is(.btn.primary, .fx-btn.fx-primary, #st-n):hover { background: var(--st-accent-bg-hov); }
[data-style=material] :is(.field textarea, .field input[type=text], .search input, select.pill, .fin, .fx-field, .fx-card input[type=text], .fx-card input[type=number], .fx-card input[type=time], .fx-card select, .fx-card textarea) { border: 0; border-bottom: 1px solid var(--st-muted); border-radius: 4px 4px 0 0; background: var(--st-field); box-shadow: none; }
[data-style=material] :is(.field textarea, .field input[type=text], .search input, select.pill, .fin, .fx-field, .fx-card input[type=text], .fx-card input[type=number], .fx-card input[type=time], .fx-card select, .fx-card textarea):focus { border-bottom: 2px solid var(--st-accent); box-shadow: none; }

/* Neumorphic (soft UI): everything is the page itself, pushed out (raised) or pressed in (wells), lit from the top left. */
:root[data-style=neumorph] { --st-bg: light-dark(#e0e5ec, #2a2e35); --st-card: var(--st-bg); --st-panel: var(--st-bg); --st-field: var(--st-bg);
  --st-line: light-dark(rgba(130,145,170,.28), rgba(0,0,0,.28)); --st-text: light-dark(#2d3440, #e3e7ee); --st-text2: light-dark(#3e4656, #c2c8d3);
  --st-muted: light-dark(#586274, #959eae); --st-accent: light-dark(#3d5ef0, #7d9bff); --st-soft: light-dark(rgba(61,94,240,.1), rgba(125,155,255,.12));
  --st-accent-bg: light-dark(#3d5ef0, #4d6cf0); --st-accent-bg-hov: light-dark(#2f4fe0, #6a86f5); --st-on-accent: #fff;
  --st-head: light-dark(rgba(224,229,236,.95), rgba(42,46,53,.95)); --nu-d: light-dark(#a3b1c6, #1b1e23); --nu-l: light-dark(#fff, #393e47);
  --st-shadow: 6px 6px 14px var(--nu-d), -6px -6px 14px var(--nu-l); }
[data-style=neumorph] :is(.card, .col, .pop, .drawer, .qa, .fx-card) { border: 0; border-radius: 16px; box-shadow: 6px 6px 14px var(--nu-d), -6px -6px 14px var(--nu-l); }

<body>

<div class="banner" id="demoBanner" hidden>Demo board — sample ideas, nothing is saved.</div>

      <label class="sw" id="shapeSw"><input type="checkbox" id="autoShape"><b></b>✨ Shape</label>

<div class="pop" id="binPop"></div>
<div class="pop" id="nextPop"></div>
<div class="pop wide" id="trayPop"></div>
<div class="toast" id="toast"></div>

<script>
/* fleet-styles:begin js */
/* Fleet styles kit v1 (script half). Copy kept in Nexus/styles. Only the Settings page needs it; the pages that
   wear a style get <html data-style> from Swift (FleetStyles.wear) and need only the CSS half.
   FleetStyles.picker(box, styles, current, onPick)   draws the Style cards (radios, name=uiStyle) into box the first
       time and ticks `current` every time; styles = [{ id, name, blurb }] from the app (FleetStyles.list in Swift).
       onPick(id) runs when the user picks one: post it to the app the way the page posts its other settings.
   FleetStyles.picked(box)   the ticked style's id */
window.FleetStyles = window.FleetStyles || (function () {
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
  function picker(box, styles, current, onPick) {
    if (!box) return;
    box.classList.add("st-grid");
    if (!box.childElementCount) {
      for (const { id, name, blurb } of styles || []) {
        const input = el("input"); input.type = "radio"; input.name = "uiStyle"; input.value = id;
        input.addEventListener("change", e => { e.stopPropagation(); if (input.checked && onPick) onPick(id); });
        const pv = el("div", "st-pv st-" + id), card = el("b", "c");
        card.append(el("i"), el("i"));
        pv.append(el("b", "h"), card, el("b", "k"), el("b", "p"));
        const label = el("label"); label.title = blurb || "";
        label.append(input, pv, el("span", "st-n", name), el("span", "st-d", blurb));
        box.append(label);
      }
    }
    for (const i of box.querySelectorAll("input[name=uiStyle]")) i.checked = i.value === current;
  }
  const picked = box => ((box || document).querySelector("input[name=uiStyle]:checked") || {}).value;
  return { picker, picked };
})();
/* fleet-styles:end js */
const STAGES = [
  {k:'inbox',    icon:'💭', name:'Inbox',    hint:'Raw thoughts, not shaped yet'},
  {k:'shaped',   icon:'📐', name:'Shaped',   hint:'Clear and ready to pick up'},
  {k:'building', icon:'🔨', name:'Building', hint:'Being built right now'},
  {k:'shipped',  icon:'🚀', name:'Shipped',  hint:'Done and released'},
  {k:'parked',   icon:'🧊', name:'Parked',   hint:'Not now — maybe later'},
];
const CSTAGES = [
  {k:'open',   icon:'🧗', name:'Open',      hint:'Problems waiting for an idea · hottest first', c:'ch-open'},
  {k:'ideas',  icon:'💡', name:'Has ideas', hint:'Ideas on the way',                            c:'ch-ideas'},
  {k:'solved', icon:'✅', name:'Solved',    hint:'Solved when a linked idea ships',              c:'ch-solved'},
];
const QUADS = [
  {k:'high:low',  icon:'🎯', name:'Quick wins', hint:'High impact · low effort — do these first', c:'#10b981'},
  {k:'high:high', icon:'🚀', name:'Big bets',   hint:'High impact · high effort — plan them',     c:'#8b5cf6'},
  {k:'low:low',   icon:'🧩', name:'Fill-ins',   hint:'Low impact · low effort — for a spare hour', c:'#0ea5e9'},
  {k:'low:high',  icon:'🕳️', name:'Money pits', hint:'Low impact · high effort — think twice',    c:'#94a3b8'},
];
const TYPES = {agent:{icon:'🤖',name:'New agent'}, enhancement:{icon:'✨',name:'Enhancement'}, fix:{icon:'🐞',name:'Fix'}, chore:{icon:'🧹',name:'Chore'}};
const HOMES = {
  personal:{icon:'🏠',name:'Personal',hint:'Ships to your public GitHub — anyone can use it and help build it.'},
  work:{icon:'💼',name:'Work',hint:'Ships to your work git — work data and code stay inside work.'},
  local:{icon:'🔒',name:'Local',hint:'Stays on this Mac — never pushed anywhere.'},
};
const PRIO = {high:{icon:'🔥',name:'High'}, med:{icon:'⚡',name:'Medium'}, low:{icon:'🌱',name:'Low'}};
const ORIGINS = {you:{icon:'👤',name:'You'}, ai:{icon:'✨',name:'AI'}, page:{icon:'🌐',name:'From a page'}, teammate:{icon:'🤝',name:'Teammate'}};
const OFTEN = {daily:'Daily', weekly:'Weekly', monthly:'Monthly', rare:'Rarely'};
const AV = ['#8b5cf6','#3b82f6','#10b981','#f59e0b','#ef4444','#0ea5e9','#ec4899','#14b8a6'];

const PERSONAL = {name:'Idea Forge', symbol:'💡', flavor:'personal', repo:'https://github.com/Sravankumartangudu/idea-forge', repoLabel:'GitHub',
  tools:'', dataFolder:true, pageReading:false, appearances:[['system', 'System'], ['light', 'Light'], ['dark', 'Dark']]};
const NO_AI = {provider:'', word:'AI', ready:false, problem:'', model:'', models:[], providers:[], claude:false, codex:false};
const S = {doc:{version:1, ideas:[], challenges:[]}, apps:[], people:[], ai:NO_AI, updates:{}, hotkeys:'', demo:false, settings:{}, file:'', version:'', ed:PERSONAL,
           customFolder:false, tab:localStorage.tab || 'ideas', view:localStorage.view || 'stages',
           q:'', fType:'all', fHome:'all', fGroup:'', fOrigin:'all', selecting:false, picked:new Set(), open:null, openKind:'idea',
           shaping:new Set(), chShaping:new Set(), sparking:new Set(), asking:new Set(), autoLive:{}, autoConfirm:null,
           nexting:false, placing:false, capturing:false, finding:false, testing:false, testResult:null, deferred:null};
if (!['ideas', 'challenges', 'matrix'].includes(S.tab)) S.tab = 'ideas';

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post = m => { try { webkit.messageHandlers.forge.postMessage(m) } catch (e) { console.log('post', m.cmd) } };
const now = () => new Date().toISOString();
const ideas = () => S.doc.ideas;
const chs = () => S.doc.challenges;
const byId = id => ideas().find(i => i.id === id);
const chById = id => chs().find(c => c.id === id);
const stageOf = k => STAGES.find(s => s.k === k);
const clip = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s;
const nameOf = i => (i.title || '').trim() || clip((i.raw || '').trim().split('\n')[0], 90) || 'Untitled idea';
const cname = c => (c.title || '').trim() || clip((c.detail || c.raw || '').trim().split('\n')[0], 90) || 'Untitled challenge';
const isPending = i => ['inbox','shaped','building'].includes(i.status);
const initials = n => n.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const avColor = n => AV[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % AV.length];
const fmtDate = s => s ? new Date(s).toLocaleDateString(undefined, {day:'numeric', month:'short'}) : '';
const appHome = name => (S.apps.find(a => a.name.toLowerCase() === (name || '').toLowerCase()) || {}).home || '';
const aiOK = () => !!S.ai.ready;
const word = () => S.ai.word || 'AI';
const pageOn = () => !!(S.ed.pageReading && S.settings.pageReading);
const originOf = x => (x.origin && x.origin.by) || 'you';
/// Only web links from pages or the AI become clickable (never javascript: or file:).
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const groupOf = i => (i.group || '').trim() || (i.app || '').trim();
const ago = s => { if (!s) return ''; const m = Math.round((Date.now() - new Date(s)) / 60000);
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
const keys = () => S.hotkeys || (S.settings.hotkeyShift ? '⌃⌥⇧' : '⌃⌥');
/// How much a challenge is worth solving: impact × how often × times hit (same as the app's).
const heat = c => ({high:3, med:2, low:1}[c.impact] || 2) * ({daily:4, weekly:3, monthly:2, rare:1}[c.often] || 2) * Math.max(1, c.hits || 1);
const linkedIdeas = c => ideas().filter(i => i.challenge === c.id && !['removed', 'suggested'].includes(i.status));
const chStage = c => c.status === 'solved' ? 'solved' : linkedIdeas(c).some(i => i.status !== 'parked') ? 'ideas' : 'open';
const tray = () => ({ideas:ideas().filter(i => i.status === 'suggested'), chs:chs().filter(c => c.status === 'suggested')});
const groups = () => [...new Set(ideas().filter(i => !['removed', 'suggested'].includes(i.status)).map(groupOf).filter(Boolean))].sort((a, b) => a.localeCompare(b));

// ---------- Persistence ----------
let saveTimer = null;
function save(soon) {
  clearTimeout(saveTimer);
  saveTimer = null;
  const go = () => { saveTimer = null; post({cmd:'save', doc:S.doc}); };
  if (soon) saveTimer = setTimeout(go, 350); else go();
}
function touch(x) { x.updated = now(); }
const nextN = () => Math.max(0, ...ideas().map(i => i.n || 0)) + 1;
const nextCN = () => Math.max(0, ...chs().map(c => c.n || 0)) + 1;
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function newIdea(fields) {
  const status = fields.status || 'inbox';
  const col = ideas().filter(i => i.status === status);
  const order = col.length ? Math.min(...col.map(i => i.order ?? 0)) - 1 : 0;
  const t = now();
  return Object.assign({id:newId('i'), n: status === 'suggested' ? null : nextN(), title:'', raw:'', summary:'', why:'',
    type:'', home:'', app:'', group:'', status, priority:'med', steps:[], helpers:[], tags:[], order, created:t, updated:t}, fields);
}
function newChallenge(fields) {
  const t = now();
  const status = fields.status || 'open';
  return Object.assign({id:newId('c'), n: status === 'suggested' ? null : nextCN(), title:'', detail:'', where:'', raw:'',
    often:'weekly', impact:'med', status, hits:1, created:t, updated:t}, fields);
}

// ---------- Bridge (called by the app) ----------
function notifyOrToast(bg, title, body, count) {
  if (bg) post({cmd:'notify', title, body, open: count ? 'forge.showTray()' : ''});
  else toast(body, count ? () => openTray() : null, 'Review');
}
window.forge = {
  load(state) {
    if (drag && drag.started) { S.deferred = state; return; }
    // A typing save still waiting to go out is newer than the app's copy — keep it.
    if (!saveTimer) S.doc = state.doc && Array.isArray(state.doc.ideas) ? state.doc : {version:1, ideas:[]};
    S.doc.challenges = S.doc.challenges || [];
    S.apps = state.apps || []; S.people = state.people || []; S.demo = !!state.demo;
    S.ai = Object.assign({}, NO_AI, state.ai || {});
    if (S.demo) S.ai.problem = '';
    S.updates = state.updates || {}; S.hotkeys = state.hotkeys || '';
    S.settings = state.settings || {}; S.file = state.file || ''; S.version = state.version || ''; S.customFolder = !!state.customFolder;
    S.ed = Object.assign({}, PERSONAL, state.edition || {});
    S.styles = state.styles || []; S.uiStyle = state.uiStyle || 'standard'; S.styleFleet = !!state.styleFleet;
    applyEdition();
    const building = new Set(state.autoRunning || []);
    for (const i of ideas()) {
      i.steps = i.steps || []; i.helpers = i.helpers || []; i.tags = i.tags || []; i.status = i.status || 'inbox';
      // An answer that was on its way when the app quit never arrives.
      for (const c of i.chat || []) if (c.pending && !S.asking.has(i.id)) { delete c.pending; c.err = 'Interrupted — ask again.'; }
      // Nor does an ⚡ Auto-build: quitting stops it.
      if (i.auto && i.auto.state === 'running' && !building.has(i.id)) Object.assign(i.auto, {state:'stopped', error:'Stopped when the app quit.'});
      if (i.auto && i.auto.deploy && i.auto.deploy.state === 'running' && !building.has(i.id)) Object.assign(i.auto.deploy, {state:'stopped', error:'Stopped when the app quit.'});
      // Builds before the deploy tracker went straight to Shipped; they wait in Building until they're installed.
      if (i.auto && i.auto.state === 'done' && !i.auto.track && i.status === 'shipped') { i.status = 'building'; delete i.shippedAt; }
    }
    for (const c of chs()) c.status = c.status || 'open';
    $('#demoBanner').hidden = !S.demo;
    renderAll();
    trackAll();
  },
  shaped(id, cards, err) {
    S.shaping.delete(id);
    const i = byId(id);
    if (!i) return;
    if (err || !cards || !cards.length) { i.shapeError = err || `${word()} returned nothing.`; render(); return; }
    delete i.shapeError;
    applyCard(i, cards[0]);
    if (i.status === 'inbox') i.status = 'shaped';
    let after = i.order ?? 0;
    for (const c of cards.slice(1)) {
      const extra = newIdea({raw:i.raw, status:i.status, origin:i.origin, challenge:i.challenge});
      applyCard(extra, c);
      extra.order = after += 0.001;
      ideas().push(extra);
      flashIds.add(extra.id);
    }
    flashIds.add(i.id);
    save(); renderAll();
    toast(cards.length > 1 ? `✨ Shaped into ${cards.length} cards` : '✨ Shaped: ' + nameOf(i));
  },
  challengeShaped(id, obj, err) {
    S.chShaping.delete(id);
    const c = chById(id);
    if (!c) return;
    if (err || !obj) { c.shapeError = err || `${word()} returned nothing.`; render(); return; }
    delete c.shapeError;
    const same = obj.same && chs().find(x => x.n === obj.same && x !== c && ['open', 'solved'].includes(x.status));
    if (same) {
      // Already on the list: count it as another hit instead of a second card.
      same.hits = (same.hits || 1) + (c.hits || 1); same.lastHit = now(); touch(same);
      S.doc.challenges = chs().filter(x => x !== c);
      if (S.open === c.id) closeDrawer();
      flashIds.add(same.id);
      save(); renderAll();
      toast(`🧗 Same as C#${same.n} — counted as hit ×${same.hits}`);
      return;
    }
    Object.assign(c, {title:obj.title || c.title, detail:obj.detail || c.detail, where:obj.where || c.where,
                      often:obj.often || c.often, impact:obj.impact || c.impact, shapedAt:now()});
    touch(c); flashIds.add(c.id);
    save(); renderAll();
    if (S.settings.autoSpark !== false && c.status === 'open' && !linkedIdeas(c).length) spark(c);
  },
  sparked(id, cards, err) {
    S.sparking.delete(id);
    const c = chById(id);
    if (!c) return;
    if (err || !cards || !cards.length) { c.sparkError = err || `${word()} had no ideas.`; render(); return; }
    delete c.sparkError;
    for (const card of cards) {
      const i = newIdea({status:'suggested', challenge:c.id, origin:{by:'ai', label:`Sparked from C#${c.n ?? '–'}`}});
      applyCard(i, card);
      ideas().push(i);
    }
    save(); renderAll();
    toast(`✨ ${cards.length} idea${cards.length > 1 ? 's' : ''} for C#${c.n ?? '–'} — in Suggested`, () => openTray(), 'Review');
  },
  answered(id, res, err) {
    S.asking.delete(id);
    const i = byId(id);
    if (!i) return;
    const q = (i.chat || [])[0];
    if (q && q.pending) {
      delete q.pending;
      if (err || !res) q.err = err || `${word()} returned nothing.`;
      else { q.a = res.answer || ''; q.steps = (res.steps || []).filter(Boolean); }
      q.at = now();
      save();
    }
    if (S.open === id) renderDrawer();
  },
  whatNext() { whatNext(); },
  nextPicks(res, err) {
    S.nexting = false;
    if (err || !res) S.nextErr = err || `${word()} returned nothing.`;
    else { delete S.nextErr; S.doc.next = {at:now(), picks:(res.picks || []).filter(p => ideas().some(i => i.n === p.n && isPending(i))), note:res.note || ''}; save(); }
    render();
    if (!$('#nextPop').classList.contains('on')) togglePop('nextPop'); else renderNext();
  },
  placed(res, err) {
    S.placing = false;
    if (err || !res) { toast('⚠︎ ' + (err || `${word()} returned nothing.`)); render(); return; }
    let k = 0;
    for (const p of res.places || []) {
      const i = ideas().find(x => x.n === p.n && isPending(x));
      if (!i) continue;
      i.impact = p.impact; i.effort = p.effort; i.placeWhy = p.why || ''; touch(i); flashIds.add(i.id); k++;
    }
    save(); render();
    toast(`✨ Placed ${k} idea${k === 1 ? '' : 's'} on the grid`);
  },
  // 📎 A page came back read: its challenges and ideas wait in the tray. Only a neutral label, the
  // source and the link are kept — never the page's own title or text.
  pageRead(p, err, bg) {
    S.capturing = false;
    if (err || !p) { renderTabs(); notifyOrToast(bg, '📎 Couldn\'t read the page', '📎 ' + (err || 'Nothing came back.'), 0); return; }
    const r = p.result || {};
    const origin = {by:'page', source:r.source || p.app || '', label:r.label || '', url:p.url || ''};
    const got = (r.challenges || []).map(c => takeChallenge(c, origin));
    const link = got.length === 1 ? (got[0].hit || got[0].added) : null;
    for (const card of r.ideas || []) {
      const i = newIdea({status:'suggested', origin, challenge: link ? link.id : ''});
      applyCard(i, card);
      ideas().push(i);
    }
    save(); renderAll();
    const added = got.filter(g => g.added).length, hits = got.filter(g => g.hit), n = added + (r.ideas || []).length;
    const parts = [added && `${added} challenge${added > 1 ? 's' : ''}`, (r.ideas || []).length && `${r.ideas.length} idea${r.ideas.length > 1 ? 's' : ''}`].filter(Boolean);
    let body = parts.length ? `Found ${parts.join(' and ')} — in ✨ Suggested.` : (hits.length ? '' : `Nothing to add. ${r.note || ''}`.trim());
    if (hits.length) body += (body ? ' ' : '') + hits.map(h => `C#${h.hit.n} hit again (×${h.hit.hits}).`).join(' ');
    notifyOrToast(bg, '📎 ' + [r.label, r.source].filter(Boolean).join(' · '), (bg ? '' : '📎 ') + body, n);
  },
  found(res, err, bg) {
    S.finding = false;
    if (err || !res) { renderTabs(); if (!bg) toast('🔍 ' + (err || 'Nothing came back.')); return; }
    const got = (res.challenges || []).map(c => takeChallenge(c, {by:'ai', label:'🔍 Found', source:c.source || '', url:c.url || ''}));
    S.settings.lastFind = now();
    save(); renderAll();
    const added = got.filter(g => g.added).length, hits = got.filter(g => g.hit).length;
    const body = (added ? `Found ${added} challenge${added > 1 ? 's' : ''} — in ✨ Suggested.` : 'No new challenges.')
      + (hits ? ` ${hits} already on your list got another hit.` : '') + (res.note ? ' ' + res.note : '');
    notifyOrToast(bg, '🔍 Find challenges', (bg ? '' : '🔍 ') + body, added);
  },
  quick(kind, text) { kind === 'challenge' ? addChallenge(text) : addThought(text); },
  tab(t) { setTab(t); },
  showTray() { openTray(); },
  openSettings() { closeDrawer(); $$('.pop').forEach(p => p.classList.remove('on')); renderSettings(); $('#setPop').classList.add('on'); },
  tested(ok, text) { S.testing = false; S.testResult = {ok, text}; if ($('#setPop').classList.contains('on')) renderSettings(); },
  toast(text) { toast(text); },
  open(url) { post({cmd:'open', url}); },
  built(ok) { toast(ok ? '🚀 Opened in Terminal' : '⚠︎ Couldn\'t open Terminal'); },
  // ⚡ Auto-build: started (or refused), what it's doing now, and how it ended.
  autoStarted(id, err, info) {
    const i = byId(id);
    if (!i || !i.auto) return;
    if (err) {
      delete S.autoLive[id];
      if (i.auto.from && i.status === 'building') setStatus(i, i.auto.from);
      Object.assign(i.auto, {state:'failed', error:err, ended:now()});
      toast('⚡ ' + err);
    } else {
      Object.assign(i.auto, info);
      toast(`⚡ Building #${i.n} in ~/${info.folder} — the card moves on its own when it's done`);
    }
    save(); render(); if (S.open === id) renderDrawer();
  },
  autoProgress(id, line) {
    S.autoLive[id] = line;
    $$(`[data-autolive="${CSS.escape(id)}"]`).forEach(e => { e.textContent = line; e.title = line; });
  },
  autoBuilt(id, r, bg) {
    delete S.autoLive[id];
    const i = byId(id);
    if (!i) return;
    const ok = !!r.ok;
    i.auto = {state: ok ? 'done' : r.stopped ? 'stopped' : 'failed', started:(i.auto || {}).started, ended:now(),
      dir:r.dir || '', folder:r.folder || '', session:r.session || '', summary:r.summary || '', tryIt:r.tryIt || '',
      files:(r.files || []).slice(0, 40).map(f => String(f).replace(/^\/private(?=\/)/, '').replace((r.dir || '\0') + '/', '')), error: ok ? '' : (r.blocker || r.error || 'Stopped.'), cost:r.cost, minutes:r.minutes};
    if (ok) {
      for (const k of r.stepsDone || []) if (i.steps[k - 1]) i.steps[k - 1].done = true;
      if (!i.app && r.fresh && r.folder) i.app = r.folder;
      if (!['removed', 'building'].includes(i.status)) setStatus(i, 'building');
    }
    touch(i); flashIds.add(i.id);
    save(); renderAll(); if (S.open === id) renderDrawer();
    if (ok) trackAll(true);
    const title = ok ? `⚡ Built #${i.n} ${nameOf(i)}` : `⚡ #${i.n} didn't finish`;
    const body = ok ? `Built in ~/${i.auto.folder}, not deployed yet. Review it, then 🚀 Deploy it from the card.`
                    : `${clip(i.auto.error, 160)} It stays in Building.`;
    if (bg) post({cmd:'notify', title, body, open:`forge.openCard(${JSON.stringify(id)})`});
    else toast(`${title} — ${body}`, () => openDrawer(id), 'Open');
  },
  // 🚀 Deploy: how the run ended (or why it didn't start). The tracker then reads how far it really got.
  deployed(id, r, bg) {
    delete S.autoLive[id];
    const i = byId(id);
    if (!i || !i.auto) return;
    const ok = !!r.ok, was = i.auto.deploy || {};
    i.auto.deploy = r.refused ? Object.assign(was, {state:'failed', error:r.error, ended:now()})
      : {state: ok ? 'done' : r.stopped ? 'stopped' : 'failed', started:was.started, ended:now(), summary:r.summary || '',
         version:r.version || '', tag:r.tag || '', session:r.session || '', error: ok ? '' : (r.blocker || r.error || 'Stopped.'),
         cost:r.cost, minutes:r.minutes};
    touch(i); flashIds.add(i.id);
    save(); render(); if (S.open === id) renderDrawer();
    trackAll(true);
    if (r.refused) { toast('🚀 ' + r.error); return; }
    const title = ok ? `🚀 Deployed #${i.n} ${nameOf(i)}` : `🚀 #${i.n} didn't deploy`;
    const body = ok ? (r.summary ? clip(r.summary, 160) : `Shipped${r.version ? ' ' + r.version : ''} from ~/${i.auto.folder}.`)
                    : `${clip(i.auto.deploy.error, 160)} It stays in Building.`;
    if (bg) post({cmd:'notify', title, body, open:`forge.openCard(${JSON.stringify(id)})`});
    else toast(`${title} — ${body}`, () => openDrawer(id), 'Open');
  },
  tracked(map) {
    let changed = false;
    for (const [id, t] of Object.entries(map || {})) {
      const i = byId(id);
      if (!i || !i.auto) continue;
      const before = JSON.stringify(i.auto.track || null);
      i.auto.track = t;
      if (JSON.stringify(t) !== before) changed = true;
      // Once the installed app holds the change, it's shipped. Only once: moving it back out sticks.
      if (deployed(i) && !i.auto.landed && i.status !== 'removed') {
        i.auto.landed = now(); changed = true;
        if (i.status !== 'shipped') { setStatus(i, 'shipped'); flashIds.add(i.id); toast(`🚀 #${i.n} ${clip(nameOf(i), 40)} is ${stages(i).pop().name.toLowerCase()} — moved to Shipped`); }
      }
    }
    if (!changed) return;
    save(); render(); if (S.open && map[S.open]) renderDrawer();
  },
  focusCapture() { closeDrawer(); if (S.tab === 'matrix') setTab('ideas'); setTimeout(() => $('#thought').focus(), 60); },
  capture(text) { addThought(text); },
  openCard(id) { if (byId(id)) openDrawer(id); else if (chById(id)) openChallenge(id); },
};

/// A challenge the AI found: another hit on one already listed, else a new suggestion in the tray.
function takeChallenge(c, origin) {
  const same = (c.same && chs().find(x => x.n === c.same && ['open', 'solved'].includes(x.status)))
    || chs().find(x => x.status === 'suggested' && cname(x).toLowerCase() === (c.title || '').trim().toLowerCase());
  if (same) { same.hits = (same.hits || 1) + 1; same.lastHit = now(); touch(same); return {hit:same}; }
  const x = newChallenge({status:'suggested', title:c.title || '', detail:c.detail || '', where:c.where || '',
                          often:c.often || 'weekly', impact:c.impact || 'med', origin});
  chs().push(x);
  return {added:x};
}

function applyCard(i, c) {
  const app = S.apps.find(a => a.name.toLowerCase() === (c.app || '').toLowerCase());
  const done = new Set(i.steps.filter(s => s.done).map(s => s.t.toLowerCase()));
  // Reuse a group already on the board when the AI spells it a little differently.
  const g = (c.group || '').trim(), known = groups().find(x => x.toLowerCase() === g.toLowerCase());
  Object.assign(i, {
    title: c.title || i.title, summary: c.summary || '', why: c.why || '',
    type: c.type || i.type, app: app ? app.name : (c.app || ''),
    group: i.group || known || g || (app ? app.name : ''),
    home: c.home || (app && app.home) || i.home || '',
    priority: c.priority || i.priority || 'med',
    steps: (c.steps || []).map(t => ({t, done: done.has(t.toLowerCase())})),
    helpers: [...new Set([...(i.helpers || []), ...(c.helpers || [])])],
    tags: (c.tags || []).slice(0, 3), shapedAt: now(),
    similar: (c.similar || []).filter(n => n !== i.n && ideas().some(x => x.n === n && x.status !== 'removed')),
  });
  touch(i);
}

function needAI() {
  if (aiOK()) return true;
  toast(S.demo ? 'Demo board — no AI here' : '⚠︎ ' + (S.ai.problem || 'Set up an AI in Settings'), S.demo ? null : () => forge.openSettings(), 'Settings');
  return false;
}

function shape(i, single) {
  if (!needAI()) return;
  delete i.shapeError;
  S.shaping.add(i.id);
  let text = i.raw || i.title;
  if (single && (i.title || i.summary)) text += `\n\n(Current card — title: ${i.title}; notes: ${i.summary})`;
  post({cmd:'shape', id:i.id, text, single});
  render();
}
function shapeChallenge(c) {
  if (!needAI()) return;
  delete c.shapeError;
  S.chShaping.add(c.id);
  let text = c.raw || c.title;
  if (c.shapedAt && (c.title || c.detail)) text += `\n\n(Current card — title: ${c.title}; detail: ${c.detail})`;

function chBrief(c) {

          `How often: ${OFTEN[c.often] || c.often} · impact: ${c.impact} · hit ${c.hits || 1}×`].filter(Boolean).join('\n');
}
function spark(c) {

function applyEdition() {

// ---------- Tray (✨ Suggested) ----------
function keepIdea(i) {
  i.n = nextN();
  setStatus(i, i.title ? 'shaped' : 'inbox');
  const col = ideas().filter(x => x.status === i.status && x !== i);
  i.order = col.length ? Math.min(...col.map(x => x.order ?? 0)) - 1 : 0;
  flashIds.add(i.id);
}
function keepChallenge(c) {
  c.n = nextCN(); c.status = 'open'; touch(c); flashIds.add(c.id);
  // Its suggested ideas now say which challenge they're for.
  for (const i of ideas()) if (i.challenge === c.id && i.status === 'suggested' && i.origin) i.origin.label = i.origin.label || `For C#${c.n}`;
  if (S.settings.autoSpark !== false && aiOK() && !ideas().some(i => i.challenge === c.id && i.status !== 'removed')) spark(c);
}
function dismissIdea(i) { S.doc.ideas = ideas().filter(x => x !== i); }
function dismissChallenge(c) {
  S.doc.challenges = chs().filter(x => x !== c);
  S.doc.ideas = ideas().filter(i => !(i.challenge === c.id && i.status === 'suggested'));
  for (const i of ideas()) if (i.challenge === c.id) i.challenge = '';
}
function openTray() { closeDrawer(); $$('.pop').forEach(p => p.classList.remove('on')); renderTray(); $('#trayPop').classList.add('on'); }
function renderTray() {
  const t = tray();

// ---------- AI on the board ----------
function boardText() {
  const lines = [];
  for (const k of ['building', 'shaped', 'inbox']) for (const i of ideas().filter(x => x.status === k).sort((a, b) => (a.order ?? 0) - (b.order ?? 0))) {
    const st = i.steps || [], c = i.challenge && chById(i.challenge);
    lines.push(`#${i.n} [${k}] ${nameOf(i)}` + [TYPES[i.type] && TYPES[i.type].name, groupOf(i) && 'group ' + groupOf(i), PRIO[i.priority] && PRIO[i.priority].name + ' priority',
      c && c.n && `solves C#${c.n} (${OFTEN[c.often] || ''}, ${c.impact} impact, hit ${c.hits || 1}×)`,
      i.impact && `${i.impact} impact / ${i.effort} effort`,
      st.length && `${st.filter(s => s.done).length}/${st.length} steps done`, 'added ' + fmtDate(i.created), i.updated && 'touched ' + fmtDate(i.updated)].filter(Boolean).map(x => ' · ' + x).join('')
      + (i.summary ? `\n   ${i.summary}` : ''));
  }
  const open = chs().filter(c => c.status === 'open').sort((a, b) => heat(b) - heat(a));
  if (open.length) {
    lines.push('', 'Open challenges:');
    for (const c of open) lines.push(`C#${c.n} ${cname(c)} · ${OFTEN[c.often] || ''} · ${c.impact} impact · hit ${c.hits || 1}× · ${linkedIdeas(c).length} ideas`);
  }
  return lines.join('\n');
}
function whatNext() {
  if (!needAI()) return;
  if (!ideas().some(isPending)) { toast('Nothing pending to pick from'); return; }
  if (!S.nexting) { S.nexting = true; delete S.nextErr; post({cmd:'next', board:boardText()}); }
  $$('.pop').forEach(p => p.id !== 'nextPop' && p.classList.remove('on'));
  $('#nextPop').classList.add('on'); renderNext();
}
function renderNext() {
  const nx = S.doc.next, picks = (nx && nx.picks || []).map(p => ({p, i:ideas().find(x => x.n === p.n)})).filter(x => x.i && isPending(x.i));
  $('#nextPop').innerHTML = `<h4>🎯 What to build next</h4>` +
    (S.nexting ? `<div class="shimmer" style="color:var(--accent-ink)">${esc(word())} is reading your board</div>` : '') +
    (S.nextErr ? `<div class="err">⚠︎ ${esc(S.nextErr)}</div>` : '') +
    (!S.nexting && picks.length ? picks.map(({p, i}, k) => `<div class="pick-row" data-open="${esc(i.id)}"><span class="rank">${k + 1}</span>
        <div><div class="t"><span class="ref">#${i.n}</span> ${esc(nameOf(i))}</div><div class="w">${esc(p.why)}</div></div></div>`).join('')
      + (nx.note ? `<div class="note">${esc(nx.note)}</div>` : '')
      + `<div class="hint" style="margin-top:10px">Picked ${fmtDate(nx.at)} · <a href="#" data-renext style="color:var(--accent-ink)">Ask again</a></div>` : '') +
    (!S.nexting && !picks.length && !S.nextErr ? '<div class="hint">No picks yet.</div>' : '');
}
function placeAll(all) {
  if (S.placing || !needAI()) return;
  const list = ideas().filter(i => isPending(i) && (all || !i.impact));
  if (!list.length) { toast('Every pending idea is already placed'); return; }
  S.placing = true;
  post({cmd:'place', list:list.map(i => `#${i.n} ${nameOf(i)}${i.summary ? ' — ' + i.summary : ''}${(i.steps || []).length ? ` (${i.steps.length} steps)` : ''}`).join('\n')});
  render();
}
function capturePage() {
  if (!pageOn() || S.capturing) return;
  if (!needAI()) return;
  S.capturing = true; renderTabs();
  post({cmd:'capturePage'});
}
function findChallenges() {
  if (S.finding || !needAI()) return;
  S.finding = true; renderTabs();
  post({cmd:'findChallenges'});
}
const ASKS = [['🧭', 'Make a build plan', 'Make a step-by-step build plan for this.'], ['⚠️', 'What could go wrong?', 'What could go wrong or be hard about this, and how do I avoid it?'],
              ['✂️', 'Smallest version', 'What is the smallest useful first version I could ship quickly?'], ['🤝', 'Who could help?', 'What kind of people or teams could help with this, and what should I ask them?']];
function ask(i, q) {
  q = (q || '').trim();
  if (!q || S.asking.has(i.id) || !needAI()) return;
  i.chat = [{q, pending:true, at:now()}, ...(i.chat || []).filter(c => !c.pending)].slice(0, 8);
  S.asking.add(i.id);
  post({cmd:'ask', id:i.id, brief:brief(i), q});
  save(); renderDrawer();
}
function askHTML(i) {
  const busy = S.asking.has(i.id), dis = busy || !aiOK() ? 'disabled' : '';
  return `<div class="field"><span class="lbl">💬 Ask ${esc(word())}</span>
    <div class="ask-chips">${ASKS.map(([ic, l, q], k) => `<button type="button" data-ask="${k}" ${dis} title="${esc(q)}">${ic} ${l}</button>`).join('')}</div>
    <div class="ask-in"><input type="text" id="askQ" placeholder="${aiOK() ? 'Ask anything about this idea' : esc(S.ai.problem || 'Set up an AI in Settings')}" ${aiOK() ? '' : 'disabled'}><button class="btn primary" data-act="ask" ${dis}>Ask</button></div>
    ${(i.chat || []).map((c, k) => `<div class="qa"><div class="q">💬 ${esc(c.q)}${c.pending ? '' : `<button class="x" data-chatdel="${k}" title="Forget this answer" aria-label="Forget">✕</button>`}</div>
      ${c.pending ? `<div class="shimmer" style="color:var(--accent-ink)">${esc(word())} is thinking</div>` : (c.err ? `<div class="a bad">⚠︎ ${esc(c.err)}</div>` : `<div class="a">${esc(c.a)}</div>`)}
      ${c.steps && c.steps.length ? `<ol>${c.steps.map(t => `<li>${esc(t)}</li>`).join('')}</ol><button class="btn use" data-usesteps="${k}">Use as build steps</button>` : ''}</div>`).join('')}
  </div>`;
}

// ---------- Capture ----------
function addThought(text, extra) {
  text = (text || '').trim();
  if (!text) return;
  const first = text.split('\n')[0];
  const i = newIdea(Object.assign({raw:text, title: first.length <= 80 ? first : '', group:S.fGroup || ''}, extra || {}));
  ideas().push(i);
  flashIds.add(i.id);
  save();
  if (S.settings.autoShape !== false && aiOK()) shape(i, false); else render();
  if (S.tab !== 'ideas' && !extra) setTab('ideas');
  toast('💭 Added to Inbox');
  return i;
}
function addChallenge(text) {
  text = (text || '').trim();
  if (!text) return;
  const lines = text.split('\n'), first = lines[0];
  const c = newChallenge({raw:text, title:clip(first, 80), detail: first.length > 80 ? text : lines.slice(1).join('\n').trim()});
  chs().push(c);
  flashIds.add(c.id);
  save();
  if (S.tab !== 'challenges') setTab('challenges');
  if (S.settings.autoShape !== false && aiOK()) shapeChallenge(c);
  else { render(); if (S.settings.autoSpark !== false && aiOK()) spark(c); }
  toast(`🧗 Challenge C#${c.n} added`);
}
function submitCapture() {
  const t = $('#thought');
  S.tab === 'challenges' ? addChallenge(t.value) : addThought(t.value);
  t.value = ''; autosize(t);
}

// ---------- Rendering ----------
const flashIds = new Set();
function matches(i) {
  if (S.fType !== 'all' && (i.type || 'none') !== S.fType) return false;
  if (S.fHome !== 'all' && (i.home || 'none') !== S.fHome) return false;
  if (S.fGroup && groupOf(i) !== S.fGroup) return false;
  if (S.fOrigin !== 'all' && originOf(i) !== S.fOrigin) return false;
  if (S.q) {
    const c = i.challenge && chById(i.challenge);
    const hay = [i.title, i.summary, i.raw, i.why, i.app, i.group, ...(i.tags || []), ...(i.helpers || []), '#' + i.n, c && 'C#' + c.n].join(' ').toLowerCase();
    if (!S.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}
function chMatches(c) {
  if (S.fOrigin !== 'all' && originOf(c) !== S.fOrigin) return false;
  if (S.q) {
    const hay = [c.title, c.detail, c.where, c.raw, 'C#' + c.n, c.origin && c.origin.source].join(' ').toLowerCase();
    if (!S.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function originChip(x, always) {
  const by = originOf(x), o = ORIGINS[by];
  if (by === 'you' && !always) return '';
  const who = by === 'teammate' && x.origin.name ? x.origin.name : (x.origin && x.origin.label) || o.name;
  const tip = [o.name, x.origin && x.origin.source, x.origin && x.origin.label].filter(Boolean).join(' · ');
  return `<span class="chip o-${by}" title="Added by ${esc(tip)}">${o.icon} ${esc(clip(who, 22))}</span>`;
}

function cardHTML(i, withStage) {
  const t = TYPES[i.type], h = HOMES[i.home], p = PRIO[i.priority], st = stageOf(i.status);
  const steps = i.steps || [], done = steps.filter(s => s.done).length;
  const c = i.challenge && chById(i.challenge), g = groupOf(i);
  const cls = ['card', i.type ? 't-' + i.type : '', S.picked.has(i.id) ? 'picked' : '', S.shaping.has(i.id) ? 'shaping' : '', flashIds.has(i.id) ? 'flash' : ''].join(' ');
  const helpers = (i.helpers || []).slice(0, 4).map(n => `<span class="av" style="background:${avColor(n)}" title="${esc(n)} can help">${esc(initials(n))}</span>`).join('');
  return `<article class="${cls}" data-id="${esc(i.id)}" tabindex="0" aria-label="${esc(nameOf(i))}">
    <div class="card-top">
      <span class="ref">#${i.n ?? '–'}</span>
      ${t ? `<span class="type">${t.icon} ${t.name}</span>` : `<span class="type" style="color:var(--faint)">Unshaped</span>`}
      ${p && i.priority !== 'med' ? `<span class="prio" title="${p.name} priority">${p.icon}</span>` : '<span class="prio"></span>'}
      <label class="pick" title="Select"><input type="checkbox" ${S.picked.has(i.id) ? 'checked' : ''} data-pick="${esc(i.id)}"></label>
    </div>
    <h3>${esc(nameOf(i))}</h3>
    ${i.summary ? `<p class="sum">${esc(i.summary)}</p>` : (!i.title && i.raw ? '' : (i.raw && i.raw.trim() !== i.title ? `<p class="sum">${esc(i.raw)}</p>` : ''))}
    <div class="meta">
      ${withStage && st ? `<span class="chip stg" style="--c:var(--${i.status})">${st.icon} ${st.name}</span>` : ''}
      ${h ? `<span class="chip h-${i.home}" title="${esc(h.hint)}">${h.icon} ${h.name}</span>` : (i.type ? `<span class="chip h-none" title="Where it ships isn't decided">🤔 Home?</span>` : '')}
      ${g && !withStage ? `<span class="chip grp-chip" data-group="${esc(g)}" title="Group: ${esc(g)} — click to show only this group">▤ ${esc(g)}</span>` : ''}
      ${c ? `<span class="chip chl" data-gochal="${esc(c.id)}" title="Solves: ${esc(cname(c))}">🧗 ${c.n ? 'C#' + c.n : 'Suggested'}</span>` : ''}
      ${originChip(i)}
      ${nextRank(i) ? `<span class="chip nx" title="${esc(word())}'s pick to build next">🎯 Next</span>` : ''}
      ${(i.similar || []).slice(0, 1).map(n => `<span class="chip sim" data-goto="${n}" title="${esc(word())} thinks this overlaps with #${n}">🔁 Like #${n}</span>`).join('')}
      ${(i.tags || []).slice(0, 2).map(g => `<span class="chip">${esc(g)}</span>`).join('')}
      ${helpers ? `<span class="helpers">${helpers}</span>` : ''}
    </div>
    ${steps.length ? `<div class="progress"><div class="bar"><b style="width:${Math.round(done / steps.length * 100)}%"></b></div><span>${done}/${steps.length}</span></div>` : ''}
    ${i.status === 'shipped' && i.shippedAt ? `<div class="when">🚀 Shipped ${fmtDate(i.shippedAt)}</div>` : ''}
    ${i.auto && i.auto.state === 'done' && !autoRunning(i) && i.status !== 'removed' && !(i.status === 'shipped' && deployed(i)) ? pipeHTML(i) : ''}
    ${autoRunning(i) ? `<div class="shimmer">${deploying(i) ? '🚀' : '⚡'} <span class="live" data-autolive="${esc(i.id)}">${esc(S.autoLive[i.id] || (deploying(i) ? 'Deploying' : 'Building'))}</span></div>` : ''}
    ${i.auto && ['failed', 'stopped'].includes(i.auto.state) && i.status === 'building' ? `<div class="err">⚠︎ <span>⚡ ${esc(clip(i.auto.error || 'Stopped.', 110))}</span></div>` : ''}
    ${i.auto && i.auto.state === 'done' && i.auto.deploy && ['failed', 'stopped'].includes(i.auto.deploy.state) && !deployed(i) && i.status === 'building' ? `<div class="err">⚠︎ <span>🚀 ${esc(clip(i.auto.deploy.error || 'Stopped.', 110))}</span></div>` : ''}
    ${S.tab === 'matrix' && i.placeWhy ? `<div class="why-q">${esc(i.placeWhy)}</div>` : ''}
    ${S.shaping.has(i.id) ? `<div class="shimmer">✨ Shaping with ${esc(word())}</div>` : ''}
    ${i.shapeError ? `<div class="err">⚠︎ <span>${esc(i.shapeError.slice(0, 140))}</span> <button data-retry="${esc(i.id)}">Retry</button></div>` : ''}
  </article>`;
}

function chCardHTML(c) {
  const linked = linkedIdeas(c), sug = ideas().filter(i => i.challenge === c.id && i.status === 'suggested').length;
  const cls = ['card', 'ch', 'i-' + (c.impact || 'med'), S.chShaping.has(c.id) || S.sparking.has(c.id) ? 'shaping' : '', flashIds.has(c.id) ? 'flash' : ''].join(' ');
  return `<article class="${cls}" data-chid="${esc(c.id)}" tabindex="0" aria-label="${esc(cname(c))}">
    <div class="card-top">
      <span class="ref">C#${c.n ?? '–'}</span>
      <span class="type">${esc(OFTEN[c.often] || 'Sometimes')} · ${esc({high:'🔥 High', med:'⚡ Medium', low:'🌱 Low'}[c.impact] || '')}</span>

      <button class="mini" data-hit="${esc(c.id)}" title="Ran into it again — it moves up the list">+1 Hit again</button>
